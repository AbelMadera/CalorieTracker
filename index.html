        cal: a.cal + e.cal * e.qty, p: a.p + e.p * e.qty, c: a.c + e.c * e.qty, f: a.f + e.f * e.qty,
      }), { cal: 0, p: 0, c: 0, f: 0 });

      const cals = weekKeys.map(k => Math.round(totalsFor(k).cal));
      const totals = totalsFor(selectedDate);
      const water = waterByDate[selectedDate] ?? 0;

      const fmtMonthDay = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
      const rangeLabel = `${fmtMonthDay(week[0])} — ${fmtMonthDay(week[6])}`;

      const meals = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
      const dayEntries = entriesFor(selectedDate);
      const mealData = meals.map(m => {
        const items = dayEntries.filter(e => e.meal === m);
        const cal = items.reduce((s, e) => s + e.cal * e.qty, 0);
        return { meal: m, items, cal };
      });

      const dayWorkouts = (workoutsByDate && workoutsByDate[selectedDate]) || [];
      const burned = dayWorkouts.reduce((s, w) => s + (w.cal || 0), 0);
      const net = totals.cal - burned;
      const calLeft = GOAL.cal + burned - totals.cal;

      const goPrevWeek = () => setSelectedDate(dateKey(addDays(weekStart, -7)));
      const goNextWeek = () => setSelectedDate(dateKey(addDays(weekStart, 7)));
      // Don't let users navigate into the future
      const nextWeekStart = addDays(weekStart, 7);
      const canGoNext = nextWeekStart <= new Date();

      return (
        <div className="screen" style={{ padding: '8px 20px 120px' }}>
          <div style={{ marginBottom: 14, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
            <div>
              <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>{rangeLabel}</div>
              <div style={{ fontSize: 26, fontWeight: 700, color: T.ink, letterSpacing: -0.6, marginTop: 2 }}>Diary</div>
            </div>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              {selectedDate !== todayKey && (
                <button onClick={() => setSelectedDate(todayKey)} style={{
                  height: 32, padding: '0 12px', borderRadius: 16,
                  background: T.ink, border: 'none', color: '#fff',
                  fontSize: 12, fontWeight: 600, cursor: 'pointer',
                  fontFamily: 'inherit',
                }}>Today</button>
              )}
              <button onClick={goPrevWeek} aria-label="Previous week" style={{
                width: 32, height: 32, borderRadius: 16, background: T.card,
                border: `1px solid ${T.hair}`, display: 'flex', alignItems: 'center', justifyContent: 'center',
                cursor: 'pointer', color: T.ink2,
              }}>{Ic.back(16)}</button>
              <button onClick={goNextWeek} disabled={!canGoNext} aria-label="Next week" style={{
                width: 32, height: 32, borderRadius: 16, background: T.card,
                border: `1px solid ${T.hair}`, display: 'flex', alignItems: 'center', justifyContent: 'center',
                cursor: canGoNext ? 'pointer' : 'not-allowed',
                opacity: canGoNext ? 1 : 0.4, color: T.ink2,
              }}>{Ic.chevR(16)}</button>
            </div>
          </div>

          <div style={{
            background: T.card, borderRadius: 18, padding: '12px 8px',
            border: `1px solid ${T.hair}`, marginBottom: 16,
            display: 'flex', justifyContent: 'space-between',
          }}>
            {week.map((d, i) => {
              const k = weekKeys[i];
              const active = k === selectedDate;
              const isToday = k === todayKey;
              const isFuture = d > new Date();
              const cal = cals[i];
              const ratio = cal === 0 ? 0 : Math.min(1, cal / GOAL.cal);
              return (
                <button key={k} onClick={() => !isFuture && setSelectedDate(k)} disabled={isFuture} style={{
                  flex: 1, padding: '6px 4px', background: active ? T.ink : 'none', border: 'none',
                  borderRadius: 12, cursor: isFuture ? 'not-allowed' : 'pointer',
                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
                  color: active ? '#fff' : T.ink, opacity: isFuture ? 0.35 : 1,
                }}>
                  <div style={{ fontSize: 10, fontWeight: 600, opacity: active ? 0.7 : 0.5 }}>{dayLetters[i]}</div>
                  <div style={{ fontSize: 16, fontWeight: 700, fontVariantNumeric: 'tabular-nums' }}>{d.getDate()}</div>
                  {cal === 0 ? (
                    <div style={{ width: 4, height: 4, borderRadius: 2, background: active ? 'rgba(255,255,255,0.4)' : T.hair2 }} />
                  ) : (
                    <div style={{
                      width: 22, height: 3, borderRadius: 2,
                      background: active ? 'rgba(255,255,255,0.3)' : T.hair, position: 'relative', overflow: 'hidden',
                    }}>
                      <div style={{
                        width: `${ratio * 100}%`, height: '100%',
                        background: active ? '#fff' : T.cal,
                      }} />
                    </div>
                  )}
                  {isToday && !active && (
                    <div style={{ fontSize: 8, color: T.accent, fontWeight: 700, letterSpacing: 0.5, marginTop: -2 }}>TODAY</div>
                  )}
                </button>
              );
            })}
          </div>

          <div style={{
            background: T.card, borderRadius: 18, padding: '16px 18px',
            border: `1px solid ${T.hair}`, marginBottom: 16,
          }}>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>NET CALORIES</div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginTop: 2 }}>
                <span style={{ fontSize: 28, fontWeight: 700, color: T.ink, letterSpacing: -0.8, fontVariantNumeric: 'tabular-nums' }}>
                  {num(Math.round(net))}
                </span>
                <span style={{ fontSize: 13, color: T.mute }}>/ {num(GOAL.cal)}</span>
                <span style={{
                  marginLeft: 'auto', fontSize: 12, fontWeight: 600,
                  color: calLeft < 0 ? T.warn : T.good, fontVariantNumeric: 'tabular-nums',
                }}>
                  {num(Math.round(Math.abs(calLeft)))} {calLeft < 0 ? 'over' : 'left'}
                </span>
              </div>
              <div style={{ display: 'flex', gap: 6, marginTop: 8, fontSize: 11, color: T.mute, fontVariantNumeric: 'tabular-nums' }}>
                <span>{num(Math.round(totals.cal))} eaten</span>
                <span>−</span>
                <span>{num(Math.round(burned))} burned</span>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 12, marginBottom: 16 }}>
              <MacroBar label="Protein" val={totals.p} goal={GOAL.p} color={T.protein} />
              <MacroBar label="Carbs" val={totals.c} goal={GOAL.c} color={T.carbs} />
              <MacroBar label="Fat" val={totals.f} goal={GOAL.f} color={T.fat} />
            </div>
            <div style={{ height: 1, background: T.hair, marginBottom: 14 }} />
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                {Ic.bottle(16, T.water)}
                <span style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>WATER</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 4, fontVariantNumeric: 'tabular-nums' }}>
                <span style={{ fontSize: 14, fontWeight: 700, color: T.ink }}>{water}</span>
                <span style={{ fontSize: 11, color: T.mute }}>/ {GOAL.water} bottles · {bottleOz(water)} oz</span>
              </div>
            </div>
            <WaterControl water={water} setWater={setWater} goal={GOAL.water} height={36} />
          </div>

          {/* Food and workouts are two subsections of the same day */}
          <div style={{
            display: 'flex', background: T.card, borderRadius: 12, padding: 3,
            border: `1px solid ${T.hair}`, marginBottom: 14,
          }}>
            {[
              { k: 'food', label: 'Food', sub: `${num(Math.round(totals.cal))} kcal` },
              { k: 'workouts', label: 'Workouts', sub: `${num(Math.round(burned))} kcal` },
            ].map(t => (
              <button key={t.k} className="tap" onClick={() => setSub(t.k)} style={{
                flex: 1, padding: '8px', background: sub === t.k ? T.ink : 'transparent',
                color: sub === t.k ? '#fff' : T.ink2, border: 'none', borderRadius: 9,
                cursor: 'pointer', fontFamily: 'inherit',
                display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 1,
                transition: 'background 200ms ease, color 200ms ease',
              }}>
                <span style={{ fontSize: 13, fontWeight: 600 }}>{t.label}</span>
                <span style={{
                  fontSize: 10.5, fontWeight: 500, fontVariantNumeric: 'tabular-nums',
                  color: sub === t.k ? 'rgba(255,255,255,0.7)' : T.mute,
                }}>{t.sub}</span>
              </button>
            ))}
          </div>

          <div key={sub} className="screen">
          {sub === 'food' && (
          <Fragment>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: T.mute, letterSpacing: 0.3 }}>
              {entriesFor(selectedDate).length} ITEM{entriesFor(selectedDate).length === 1 ? '' : 'S'} LOGGED
            </div>
            <button className="tap" onClick={() => onAddFood && onAddFood('Breakfast')} style={{
              height: 28, padding: '0 12px', borderRadius: 14, background: T.card,
              border: `1px solid ${T.hair2}`, color: T.ink, fontSize: 12, fontWeight: 600,
              cursor: 'pointer', fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: 4,
            }}>{Ic.plus(14)}<span>Food</span></button>
          </div>
          <div style={{ position: 'relative', paddingLeft: 0 }}>
            {mealData.map(({ meal, items, cal }, mi) => (
              <div key={meal} style={{ display: 'flex', gap: 12, paddingBottom: 16 }}>
                <div style={{ width: 56, flexShrink: 0, paddingTop: 14 }}>
                  <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.3, fontVariantNumeric: 'tabular-nums' }}>
                    {items.length > 0 ? ['Morning', 'Midday', 'Evening', 'Anytime'][mi] : '—'}
                  </div>
                </div>
                <div style={{ position: 'relative', width: 12, flexShrink: 0 }}>
                  <div style={{
                    position: 'absolute', top: 18, bottom: -8, left: 5, width: 2,
                    background: T.hair, display: mi === 3 ? 'none' : 'block',
                  }} />
                  <div style={{
                    position: 'absolute', top: 18, left: 0, width: 12, height: 12, borderRadius: 6,
                    background: items.length > 0 ? T.ink : T.card,
                    border: `2px solid ${items.length > 0 ? T.ink : T.hair2}`,
                  }} />
                </div>
                <div style={{
                  flex: 1, background: T.card, borderRadius: 14, padding: '12px 14px',
                  border: `1px solid ${T.hair}`,
                }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: items.length > 0 ? 8 : 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 600, color: T.ink }}>{meal}</div>
                    <div style={{ fontSize: 12, fontWeight: 600, color: items.length > 0 ? T.ink : T.mute, fontVariantNumeric: 'tabular-nums' }}>
                      {items.length > 0 ? `${Math.round(cal)} kcal` : 'Not logged'}
                    </div>
                  </div>
                  {items.map((it, i) => (
                    <button key={it.uid} onClick={() => onOpenFood(it)} style={{
                      width: '100%', padding: '6px 0', background: 'none', border: 'none',
                      borderTop: i > 0 ? `1px dashed ${T.hair}` : `1px solid ${T.hair}`,
                      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                      cursor: 'pointer', textAlign: 'left',
                    }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 12.5, color: T.ink, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{it.name}</div>
                        <div style={{ fontSize: 10.5, color: T.mute, marginTop: 1 }}>{it.qty}× · {(it.p * it.qty).toFixed(0)}g protein</div>
                      </div>
                      <div style={{ fontSize: 12, fontWeight: 600, color: T.ink2, fontVariantNumeric: 'tabular-nums' }}>
                        {Math.round(it.cal * it.qty)}
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>

          </Fragment>
          )}

          {sub === 'workouts' && (
          <Fragment>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: T.mute, letterSpacing: 0.3 }}>
              {dayWorkouts.length} WORKOUT{dayWorkouts.length === 1 ? '' : 'S'} LOGGED
            </div>
            <button onClick={() => setAddingWorkout(v => !v)} style={{
              height: 28, padding: '0 12px', borderRadius: 14,
              background: addingWorkout ? T.ink : T.card,
              border: `1px solid ${addingWorkout ? T.ink : T.hair2}`,
              color: addingWorkout ? '#fff' : T.ink, fontSize: 12, fontWeight: 600,
              cursor: 'pointer', fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: 4,
            }}>
              {addingWorkout ? Ic.close(14, '#fff') : Ic.plus(14)}
              <span>{addingWorkout ? 'Cancel' : 'Workout'}</span>
            </button>
          </div>

          {addingWorkout && (
            <WorkoutForm
              onCancel={() => setAddingWorkout(false)}
              onSave={(w) => { onAddWorkout(w); setAddingWorkout(false); }}
            />
          )}

          <div style={{
            background: T.card, borderRadius: 16, border: `1px solid ${T.hair}`, overflow: 'hidden',
          }}>
            {dayWorkouts.length === 0 && !addingWorkout && (
              <div style={{ padding: '20px 16px', textAlign: 'center', color: T.mute, fontSize: 12.5, lineHeight: 1.5 }}>
                No workouts logged. Anything you add here gets credited back to the day's calorie budget.
              </div>
            )}
            {dayWorkouts.map((w, i) => (
              <div key={w.uid} style={{
                padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 12,
                borderTop: i > 0 ? `1px solid ${T.hair}` : 'none',
              }}>
                <div style={{
                  width: 36, height: 36, borderRadius: 10, background: T.bg, border: `1px solid ${T.hair}`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
                }}>{Ic.dumbbell(18, T.warn)}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14, fontWeight: 500, color: T.ink, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{w.name}</div>
                  <div style={{ fontSize: 11, color: T.mute, marginTop: 1 }}>
                    {w.mins ? `${w.mins} min` : 'Manual entry'}
                  </div>
                </div>
                <div style={{ textAlign: 'right', marginRight: 4 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: T.warn, fontVariantNumeric: 'tabular-nums' }}>+{num(Math.round(w.cal))}</div>
                  <div style={{ fontSize: 10, color: T.mute }}>kcal</div>
                </div>
                <button onClick={() => onRemoveWorkout(w.uid)} aria-label={`Remove ${w.name}`} style={{
                  width: 30, height: 30, borderRadius: 15, background: 'none', border: 'none',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
                  color: T.mute, flexShrink: 0,
                }}>{Ic.trash(16)}</button>
              </div>
            ))}
          </div>
          </Fragment>
          )}
          </div>
        </div>
      );
    }

    // Inline manual workout entry — name, calories burned, optional duration.
    function WorkoutForm({ onSave, onCancel }) {
      const PRESETS = [
        { name: 'Walk', per: 4 }, { name: 'Run', per: 11 },
        { name: 'Cycling', per: 8 }, { name: 'Weights', per: 6 },
      ];
      const [name, setName] = useState('');
      const [cal, setCal] = useState('');
      const [mins, setMins] = useState('');

      const applyPreset = (p) => {
        setName(p.name);
        const m = Number(mins);
        if (m > 0) setCal(String(Math.round(m * p.per)));
      };

      const calNum = Number(cal) || 0;
      const canSave = name.trim() && calNum > 0;

      return (
        <div style={{
          background: T.card, borderRadius: 16, border: `1px solid ${T.hair}`,
          padding: 16, marginBottom: 10, display: 'flex', flexDirection: 'column', gap: 12,
        }}>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            {PRESETS.map(p => (
              <button key={p.name} onClick={() => applyPreset(p)} style={{
                padding: '6px 12px', borderRadius: 14, background: name === p.name ? T.ink : T.bg,
                color: name === p.name ? '#fff' : T.ink2,
                border: `1px solid ${name === p.name ? T.ink : T.hair2}`,
                fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit',
              }}>{p.name}</button>
            ))}
          </div>
          <Field label="Activity" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Evening run" />
          <div style={{ display: 'flex', gap: 10 }}>
            <Field label="Calories burned" value={cal} onChange={e => setCal(e.target.value.replace(/[^\d.]/g, ''))} placeholder="0" suffix="kcal" type="number" flex={1} />
            <Field label="Minutes" value={mins} onChange={e => setMins(e.target.value.replace(/[^\d.]/g, ''))} placeholder="optional" suffix="min" type="number" flex={1} />
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={onCancel} style={{
              padding: '12px 18px', borderRadius: 12, background: T.bg, border: `1px solid ${T.hair2}`,
              color: T.ink, fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit',
            }}>Cancel</button>
            <button
              disabled={!canSave}
              onClick={() => canSave && onSave({ name: name.trim(), cal: calNum, mins: Number(mins) || 0 })}
              style={{
                flex: 1, padding: '12px', borderRadius: 12,
                background: canSave ? T.ink : T.hair2, border: 'none',
                color: canSave ? '#fff' : T.mute, fontSize: 14, fontWeight: 600,
                cursor: canSave ? 'pointer' : 'default', fontFamily: 'inherit',
              }}>
              {canSave ? `Add ${num(Math.round(calNum))} kcal burned` : 'Name and calories needed'}
            </button>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // Stats
    // ═══════════════════════════════════════════════════════════════
    function Stats({ entriesByDate, waterByDate, workoutsByDate, weights = [], profile }) {
      const [range, setRange] = useState('week');
      const today = new Date();
      const todayDow = (today.getDay() + 6) % 7; // Mon=0 ... Sun=6

      const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

      // For "week": Mon..Sun of the current week
      // For "month": last 28 days ending today
      const days = (() => {
        if (range === 'week') {
          const monday = addDays(today, -todayDow);
          return Array.from({ length: 7 }, (_, i) => addDays(monday, i));
        }
        return Array.from({ length: 28 }, (_, i) => addDays(today, -(27 - i)));
      })();
      const dayKeys = days.map(dateKey);
      const todayKey = dateKey(today);
      const todayIdxInRange = dayKeys.indexOf(todayKey);

      const totalsFor = (key) => (entriesByDate[key] || []).reduce((a, e) => ({
        cal: a.cal + e.cal * e.qty, p: a.p + e.p * e.qty, c: a.c + e.c * e.qty, f: a.f + e.f * e.qty,
      }), { cal: 0, p: 0, c: 0, f: 0 });

      // Don't include future days as "missing data" — clamp at today
      const isPastOrToday = days.map(d => d <= today);
      const dayTotals = dayKeys.map((k, i) => isPastOrToday[i] ? totalsFor(k) : null);
      const data = dayTotals.map(t => t ? Math.round(t.cal) : 0);

      const loggedTotals = dayTotals.filter(t => t && t.cal > 0);
      const loggedCount = loggedTotals.length;
      const hasData = loggedCount > 0;

      const avg = loggedCount ? Math.round(loggedTotals.reduce((s, t) => s + t.cal, 0) / loggedCount) : 0;
      const max = Math.max(...data, GOAL.cal);

      const totalDays = days.length;

      // Workouts in range: sessions, the days they fell on, and calories burned
      const elapsedKeys = dayKeys.filter((_, i) => isPastOrToday[i]);
      const workoutsInRange = elapsedKeys.map(k => (workoutsByDate && workoutsByDate[k]) || []);
      const sessionCount = workoutsInRange.reduce((n, list) => n + list.length, 0);
      const burnedPerDay = workoutsInRange.map(list => list.reduce((sum, w) => sum + (w.cal || 0), 0));
      const burnDays = burnedPerDay.filter(v => v > 0);
      // Averaged over the days you actually trained, so rest days don't dilute it
      const avgBurned = burnDays.length ? Math.round(burnDays.reduce((a, b) => a + b, 0) / burnDays.length) : 0;

      // Average macro split you actually ate, weighted by calories
      const eaten = {
        p: loggedTotals.reduce((s, t) => s + t.p, 0),
        c: loggedTotals.reduce((s, t) => s + t.c, 0),
        f: loggedTotals.reduce((s, t) => s + t.f, 0),
      };
      const actual = macroSplit(eaten);
      const target = macroSplit(GOAL);
      const macroSum = macroKcal(eaten);

      return (
        <div className="screen" style={{ padding: '8px 20px 120px' }}>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>YOUR PROGRESS</div>
            <div style={{ fontSize: 26, fontWeight: 700, color: T.ink, letterSpacing: -0.6, marginTop: 2 }}>Stats</div>
          </div>

          <div style={{
            display: 'flex', background: T.card, borderRadius: 12, padding: 3,
            border: `1px solid ${T.hair}`, marginBottom: 16,
          }}>
            {['week', 'month'].map(r => (
              <button key={r} onClick={() => setRange(r)} style={{
                flex: 1, padding: '8px', background: range === r ? T.ink : 'transparent',
                color: range === r ? '#fff' : T.ink2, fontWeight: 600, fontSize: 13,
                border: 'none', borderRadius: 9, cursor: 'pointer', textTransform: 'capitalize',
              }}>{r === 'week' ? 'This week' : 'Last 28 days'}</button>
            ))}
          </div>

          <div style={{
            background: T.card, borderRadius: 20, padding: '18px', border: `1px solid ${T.hair}`, marginBottom: 12,
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
              <div>
                <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>AVG CALORIES / LOGGED DAY</div>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 4 }}>
                  <span style={{ fontSize: 30, fontWeight: 700, color: T.ink, letterSpacing: -0.8, fontVariantNumeric: 'tabular-nums' }}>
                    {hasData ? num(avg) : '—'}
                  </span>
                  {hasData && (
                    <span style={{ fontSize: 13, color: avg < GOAL.cal ? T.good : T.warn, fontWeight: 600 }}>
                      {avg < GOAL.cal ? `${num(GOAL.cal - avg)} under goal` : `${num(avg - GOAL.cal)} over`}
                    </span>
                  )}
                </div>
              </div>
            </div>

            <div style={{ position: 'relative', height: 140, marginTop: 18 }}>
              <div style={{
                position: 'absolute', left: 0, right: 0, bottom: `${(GOAL.cal / max) * 100}%`,
                borderTop: `1px dashed ${T.hair2}`,
              }}>
                <div style={{
                  position: 'absolute', right: 0, top: -8, fontSize: 9, color: T.mute, fontWeight: 600,
                  background: T.card, padding: '0 4px',
                }}>GOAL {num(GOAL.cal)}</div>
              </div>

              <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'flex-end', gap: range === 'week' ? 8 : 2 }}>
                {data.map((v, i) => {
                  const h = (v / max) * 100;
                  const over = v > GOAL.cal;
                  const isToday = i === todayIdxInRange;
                  return (
                    <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, height: '100%', justifyContent: 'flex-end' }}>
                      <div style={{
                        width: '100%', height: `${h}%`, borderRadius: range === 'week' ? 4 : 2,
                        background: over ? T.warn : (isToday ? T.ink : T.cal),
                        opacity: isToday ? 1 : (over ? 0.7 : 0.85),
                        transition: 'height 400ms',
                      }} />
                      {range === 'week' && (
                        <div style={{ fontSize: 10, color: isToday ? T.ink : T.mute, fontWeight: isToday ? 700 : 500 }}>{dayLabels[i]}</div>
                      )}
                    </div>
                  );
                })}
              </div>
              {!hasData && (
                <div style={{
                  position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 12, color: T.mute, fontWeight: 500,
                }}>No data logged yet</div>
              )}
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 12 }}>
            <KPI label="Avg calories eaten" value={hasData ? num(avg) : '—'} unit="kcal/day" color={T.cal} />
            <KPI label="Avg calories burned" value={burnDays.length ? num(avgBurned) : '—'} unit="kcal/day" color={T.warn} />
            <KPI label="Workouts" value={String(sessionCount)} unit={sessionCount === 1 ? 'session' : 'sessions'} color={T.good} />
            <KPI label="Days worked out" value={String(burnDays.length)} unit={`of ${totalDays}`} color={T.ink2} />
          </div>


          {/* Target split vs what you actually ate */}
          <div className="card" style={{
            background: T.card, borderRadius: 20, padding: '18px', border: `1px solid ${T.hair}`, marginBottom: 12,
          }}>
            <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 14 }}>
              <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>MACRO SPLIT</div>
              <div style={{ fontSize: 10.5, color: T.mute }}>Set in Settings › Macro split</div>
            </div>

            <SplitBar title="Target" split={target} />
            <div style={{ height: 12 }} />
            {macroSum > 0
              ? <SplitBar title="Your average" split={actual} />
              : (
                <div style={{ fontSize: 12, color: T.mute, padding: '4px 0' }}>
                  Log a meal to see how your average compares.
                </div>
              )}

            <div style={{
              display: 'flex', justifyContent: 'space-between', marginTop: 16, paddingTop: 14,
              borderTop: `1px solid ${T.hair}`,
            }}>
              {[
                { l: 'Protein', c: T.protein, t: target.p, a: actual.p, g: GOAL.p, ate: loggedCount ? Math.round(eaten.p / loggedCount) : null },
                { l: 'Carbs', c: T.carbs, t: target.c, a: actual.c, g: GOAL.c, ate: loggedCount ? Math.round(eaten.c / loggedCount) : null },
                { l: 'Fat', c: T.fat, t: target.f, a: actual.f, g: GOAL.f, ate: loggedCount ? Math.round(eaten.f / loggedCount) : null },
              ].map(m => (
                <div key={m.l} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                    <div style={{ width: 6, height: 6, borderRadius: 3, background: m.c }} />
                    <span style={{ fontSize: 11, color: T.mute, fontWeight: 500 }}>{m.l}</span>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                    <span style={{ fontSize: 18, fontWeight: 700, color: T.ink, fontVariantNumeric: 'tabular-nums', letterSpacing: -0.3 }}>
                      {m.ate != null ? m.ate : m.g}
                    </span>
                    <span style={{ fontSize: 10, color: T.mute }}>{m.ate != null ? `/ ${m.g}g` : 'g target'}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <WeightCard weights={weights} profile={profile} />
        </div>
      );
    }

    // Weight trend. Entries are stored in lb and converted for display, so the
    // chart doesn't change shape when you flip the unit toggle.
    function WeightCard({ weights = [], profile }) {
      const units = profile?.units || 'imperial';
      const u = weightUnit(units);
      const sorted = [...weights].sort((a, b) => a.date.localeCompare(b.date));
      const pts = sorted.slice(-30);

      const card = (children) => (
        <div style={{
          background: T.card, borderRadius: 20, padding: '18px', border: `1px solid ${T.hair}`, marginBottom: 12,
        }}>{children}</div>
      );

      if (pts.length === 0) {
        return card(
          <Fragment>
            <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, marginBottom: 8 }}>WEIGHT</div>
            <div style={{ fontSize: 12, color: T.mute, lineHeight: 1.5 }}>
              No weigh-ins yet. Add one from the You tab and your trend will show up here.
            </div>
          </Fragment>
        );
      }

      const last = pts[pts.length - 1];
      // Progress is measured from your starting weight when you've set one,
      // otherwise from the oldest weigh-in on the chart.
      const startLb = Number(profile?.startWeight) || 0;
      const first = startLb && startLb !== pts[0].w
        ? { date: pts[0].date, w: startLb, synthetic: true }
        : pts[0];
      const changeLb = last.w - first.w;
      const change = toDisplayWeight(Math.abs(changeLb), units);
      const goalLb = Number(profile?.goalWeight) || 0;
      const toGoal = goalLb ? toDisplayWeight(Math.abs(last.w - goalLb), units) : null;
      // Whether a change is progress depends on which way the goal is. Someone
      // bulking wants the line going up, so "down = good" would be wrong.
      const goingUp = changeLb > 0;
      const gaining = goalLb ? goalLb > first.w : false;
      const towardGoal = goalLb ? (gaining ? goingUp : !goingUp) : null;
      const changeColor = changeLb === 0 || towardGoal === null
        ? T.mute
        : (towardGoal ? T.good : T.warn);

      // Chart geometry
      const W = 320, H = 130, padL = 8, padR = 8, padT = 14, padB = 22;
      const vals = pts.map(p => p.w).concat(startLb ? [startLb] : []);
      let lo = Math.min(...vals), hi = Math.max(...vals);
      const showGoalLine = goalLb > 0 && Math.abs(goalLb - (lo + hi) / 2) < 40;
      if (showGoalLine) { lo = Math.min(lo, goalLb); hi = Math.max(hi, goalLb); }
      if (hi - lo < 2) { const mid = (hi + lo) / 2; lo = mid - 1; hi = mid + 1; }
      const span = hi - lo;
      const t0 = parseDateKey(first.date).getTime();
      const t1 = parseDateKey(last.date).getTime();
      const xOf = (d) => {
        if (t1 === t0) return W / 2;
        return padL + ((parseDateKey(d).getTime() - t0) / (t1 - t0)) * (W - padL - padR);
      };
      const yOf = (w) => padT + (1 - (w - lo) / span) * (H - padT - padB);
      const line = pts.map(p => `${xOf(p.date).toFixed(1)},${yOf(p.w).toFixed(1)}`).join(' ');
      const area = pts.length > 1
        ? `${padL},${H - padB} ${line} ${(W - padR)},${H - padB}`
        : null;
      const fmtShort = (k) => parseDateKey(k).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

      return card(
        <Fragment>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
            <div>
              <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>WEIGHT</div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 4 }}>
                <span style={{ fontSize: 30, fontWeight: 700, color: T.ink, letterSpacing: -0.8, fontVariantNumeric: 'tabular-nums' }}>
                  {toDisplayWeight(last.w, units)}
                </span>
                <span style={{ fontSize: 13, color: T.mute }}>{u}</span>
              </div>
            </div>
            {(pts.length > 1 || first.synthetic) && toDisplayWeight(Math.abs(changeLb), units) >= 1 && (
              <div style={{ textAlign: 'right' }}>
                <div style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 4,
                  fontSize: 15, fontWeight: 700, color: changeColor,
                  fontVariantNumeric: 'tabular-nums',
                }}>
                  <span>{changeLb === 0 ? '' : (goingUp ? '+' : '−')}{change} {u}</span>
                </div>
                <div style={{ fontSize: 10.5, color: T.mute, marginTop: 2 }}>
                  {first.synthetic ? 'since starting weight' : `since ${fmtShort(first.date)}`}
                </div>
              </div>
            )}
          </div>

          <div style={{ marginTop: 12 }}>
            <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none" style={{ display: 'block', overflow: 'visible' }}>
              <defs>
                <linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={T.accent} stopOpacity="0.20" />
                  <stop offset="100%" stopColor={T.accent} stopOpacity="0" />
                </linearGradient>
              </defs>
              {showGoalLine && (
                <Fragment>
                  <line x1={padL} y1={yOf(goalLb)} x2={W - padR} y2={yOf(goalLb)}
                    stroke={T.hair2} strokeWidth="1" strokeDasharray="4 4" />
                  <text x={W - padR} y={yOf(goalLb) - 5} textAnchor="end"
                    fontSize="9" fontWeight="600" fill={T.mute}>
                    GOAL {toDisplayWeight(goalLb, units)}
                  </text>
                </Fragment>
              )}
              {startLb > 0 && startLb >= lo && startLb <= hi && (
                <line x1={padL} y1={yOf(startLb)} x2={W - padR} y2={yOf(startLb)}
                  stroke={T.hair2} strokeWidth="1" />
              )}
              {area && <polygon points={area} fill="url(#wfill)" />}
              {pts.length > 1 && (
                <polyline points={line} fill="none" stroke={T.accent} strokeWidth="2.5"
                  strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
              )}
              {pts.map((p, i) => (
                <circle key={p.date} cx={xOf(p.date)} cy={yOf(p.w)}
                  r={i === pts.length - 1 ? 4.5 : 2.5}
                  fill={i === pts.length - 1 ? T.accent : T.card}
                  stroke={T.accent} strokeWidth="2" vectorEffect="non-scaling-stroke" />
              ))}
              <text x={padL} y={H - 6} fontSize="9" fontWeight="600" fill={T.mute}>{fmtShort(first.date)}</text>
              {pts.length > 1 && (
                <text x={W - padR} y={H - 6} textAnchor="end" fontSize="9" fontWeight="600" fill={T.mute}>{fmtShort(last.date)}</text>
              )}
            </svg>
          </div>

          <div style={{
            display: 'flex', justifyContent: 'space-between', marginTop: 10,
            paddingTop: 12, borderTop: `1px solid ${T.hair}`,
          }}>
            {[
              [startLb ? 'Starting' : 'Start', toDisplayWeight(first.w, units)],
              ['Current', toDisplayWeight(last.w, units)],
              ['Goal', goalLb ? toDisplayWeight(goalLb, units) : '—'],
              [toGoal != null && toGoal === 0 ? 'At goal' : 'To go', toGoal != null ? toGoal : '—'],
            ].map(([l, v]) => (
              <div key={l} style={{ flex: 1, textAlign: 'center' }}>
                <div style={{ fontSize: 10, color: T.mute, fontWeight: 600, letterSpacing: 0.4, textTransform: 'uppercase' }}>{l}</div>
                <div style={{ fontSize: 15, fontWeight: 700, color: T.ink, fontVariantNumeric: 'tabular-nums', marginTop: 3 }}>{v}</div>
              </div>
            ))}
          </div>

          {pts.length === 1 && (
            <div style={{ fontSize: 11, color: T.mute, marginTop: 12, lineHeight: 1.5 }}>
              Log another weigh-in from You › Weight to start the trend line.
            </div>
          )}
        </Fragment>
      );
    }

    // A labelled 100% stacked bar for one macro split.
    function SplitBar({ title, split }) {
      const parts = [
        { k: 'p', label: 'P', v: split.p, color: T.protein },
        { k: 'c', label: 'C', v: split.c, color: T.carbs },
        { k: 'f', label: 'F', v: split.f, color: T.fat },
      ];
      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
            <span style={{ fontSize: 11, color: T.ink2, fontWeight: 600 }}>{title}</span>
            <span style={{ fontSize: 11, color: T.mute, fontVariantNumeric: 'tabular-nums' }}>
              {split.p}% · {split.c}% · {split.f}%
            </span>
          </div>
          <div style={{ display: 'flex', height: 14, borderRadius: 7, overflow: 'hidden', background: T.hair }}>
            {parts.map(p => (
              <div key={p.k} style={{
                width: `${Math.max(0, p.v)}%`, background: p.color,
                transition: 'width 400ms cubic-bezier(.2,.8,.2,1)',
              }} />
            ))}
          </div>
        </div>
      );
    }

    function KPI({ label, value, unit, color }) {
      return (
        <div style={{
          background: T.card, borderRadius: 16, padding: '14px 16px', border: `1px solid ${T.hair}`,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
            <div style={{ width: 6, height: 6, borderRadius: 3, background: color }} />
            <span style={{ fontSize: 10.5, color: T.mute, fontWeight: 600, letterSpacing: 0.5, textTransform: 'uppercase' }}>{label}</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
            <span style={{ fontSize: 22, fontWeight: 700, color: T.ink, fontVariantNumeric: 'tabular-nums', letterSpacing: -0.5 }}>{value}</span>
            <span style={{ fontSize: 11, color: T.mute }}>{unit}</span>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // Profile
    // ═══════════════════════════════════════════════════════════════
    // ── Settings: a list that drills into a focused editor per setting ──────
    // Each detail screen owns a draft value and only commits on Save, so a
    // half-typed number never lands in your targets.

    function SettingScreen({ title, subtitle, onBack, onSave, canSave = true, saveLabel = 'Save', children }) {
      return (
        <div style={{ height: '100%', background: T.bg, display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: '54px 16px 14px', display: 'flex', alignItems: 'center', gap: 12 }}>
            <button className="tap" onClick={onBack} aria-label="Back" style={{
              width: 36, height: 36, borderRadius: 18, background: T.card, border: `1px solid ${T.hair}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: T.ink,
              flexShrink: 0,
            }}>{Ic.back(20)}</button>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 10, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>SETTINGS</div>
              <div style={{ fontSize: 18, fontWeight: 700, color: T.ink, letterSpacing: -0.3 }}>{title}</div>
            </div>
          </div>
          <div className="scroll" style={{ flex: 1, overflowY: 'auto', padding: '0 20px 24px' }}>
            {subtitle && (
              <div style={{ fontSize: 12.5, color: T.mute, lineHeight: 1.5, marginBottom: 14 }}>{subtitle}</div>
            )}
            {children}
          </div>
          {onSave && (
            <div style={{ padding: '12px 20px 32px', borderTop: `1px solid ${T.hair}`, background: T.card }}>
              <button className="tap" disabled={!canSave} onClick={onSave} style={{
                width: '100%', padding: '15px', borderRadius: 16, border: 'none',
                background: canSave ? T.ink : T.hair2, color: canSave ? '#fff' : T.mute,
                fontWeight: 600, fontSize: 15, fontFamily: 'inherit',
                cursor: canSave ? 'pointer' : 'default',
              }}>{saveLabel}</button>
            </div>
          )}
        </div>
      );
    }

    // Big single-value editor with a stepper, used for every numeric setting.
    // Every numeric setting is adjusted the same way: the two steppers, or by
    // typing straight into the field.
    function ValueEditor({ value, setValue, unit, step = 1, whole = false }) {
      const n = Number(value);
      const valid = value !== '' && isFinite(n) && n >= 0;
      const bump = (d) => {
        const next = Math.max(0, (valid ? n : 0) + d);
        setValue(String(whole ? Math.round(next) : +next.toFixed(2)));
      };
      // Keep the decimal point while typing — stripping it mid-entry turns
      // "207.5" into 2075. Whole-number fields round when they're saved.
      const clean = (raw) => raw.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
      return (
        <Fragment>
          <div className="card" style={{
            background: T.card, borderRadius: 20, padding: '22px 18px', border: `1px solid ${T.hair}`,
            display: 'flex', alignItems: 'center', gap: 14, marginBottom: 12,
          }}>
            <button className="tap" onClick={() => bump(-step)} aria-label="Decrease" style={{
              width: 48, height: 48, borderRadius: 24, background: T.bg, border: `1px solid ${T.hair2}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: T.ink,
              flexShrink: 0,
            }}>{Ic.minus(22)}</button>
            <div style={{ flex: 1, minWidth: 0, textAlign: 'center' }}>
              <input
                value={value}
                onChange={e => setValue(clean(e.target.value))}
                inputMode="numeric"
                style={{
                  width: '100%', border: 'none', outline: 'none', background: 'transparent',
                  fontFamily: 'inherit', fontSize: 40, fontWeight: 700, color: T.ink,
                  textAlign: 'center', letterSpacing: -1, fontVariantNumeric: 'tabular-nums', padding: 0,
                }}
              />
              <div style={{ fontSize: 12, color: T.mute, fontWeight: 500, marginTop: 2 }}>{unit}</div>
            </div>
            <button className="tap" onClick={() => bump(step)} aria-label="Increase" style={{
              width: 48, height: 48, borderRadius: 24, background: T.ink, border: 'none',
              display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: '#fff',
              flexShrink: 0,
            }}>{Ic.plus(22)}</button>
          </div>
        </Fragment>
      );
    }

    function NumberSetting({ title, subtitle, value, unit, step, whole, onBack, onSave, footer }) {
      const [v, setV] = useState(String(value));
      const raw = Number(v);
      const ok = v !== '' && isFinite(raw) && raw >= 0;
      const n = whole ? Math.round(raw) : raw;
      return (
        <SettingScreen title={title} subtitle={subtitle} onBack={onBack}
          canSave={ok} onSave={() => ok && onSave(n)}>
          <ValueEditor value={v} setValue={setV} unit={unit} step={step} whole={whole} />
          {footer && footer(ok ? n : 0)}
        </SettingScreen>
      );
    }

    function TextSetting({ title, subtitle, value, onBack, onSave }) {
      const [v, setV] = useState(value);
      const ok = v.trim().length > 0;
      return (
        <SettingScreen title={title} subtitle={subtitle} onBack={onBack}
          canSave={ok} onSave={() => ok && onSave(v.trim())}>
          <div className="card" style={{
            background: T.card, borderRadius: 20, padding: '18px', border: `1px solid ${T.hair}`,
          }}>
            <Field label={title} value={v} onChange={e => setV(e.target.value)} placeholder="Your name" autoFocus />
          </div>
        </SettingScreen>
      );
    }

    // Weight: set a starting weight once, then log a weigh-in each day.
    function WeightSetting({ profile, weights, onBack, onAddWeight, onRemoveWeight, onSetStart }) {
      const units = profile.units;
      const u = weightUnit(units);
      const sorted = [...weights].sort((a, b) => b.date.localeCompare(a.date)); // newest first
      const todayKey = dateKey();
      const today = sorted.find(w => w.date === todayKey);
      const startLb = Number(profile.startWeight) || 0;

      const [v, setV] = useState(today ? String(toDisplayWeight(today.w, units)) : '');
      const [startDraft, setStartDraft] = useState(startLb ? String(toDisplayWeight(startLb, units)) : '');
      const [editingStart, setEditingStart] = useState(!startLb);

      const n = Number(v);
      const ok = v !== '' && isFinite(n) && n > 0;

      const fmt = (k) => {
        const d = parseDateKey(k);
        return k === todayKey ? 'Today' : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      };

      return (
        <SettingScreen
          title="Weight"
          subtitle="Log a weigh-in each day. Saving again on the same day replaces that day's entry."
          onBack={onBack}
          canSave={ok}
          saveLabel={today ? "Update today's weigh-in" : "Log today's weight"}
          onSave={() => { if (ok) { onAddWeight(fromDisplayWeight(Math.round(n), units)); onBack(); } }}
        >
          {/* Starting weight */}
          <div className="card" style={{
            background: T.card, borderRadius: 20, padding: '18px', border: `1px solid ${T.hair}`, marginBottom: 12,
          }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: editingStart ? 12 : 0 }}>
              <div>
                <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>STARTING WEIGHT</div>
                {!editingStart && (
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 4, marginTop: 4 }}>
                    <span style={{ fontSize: 24, fontWeight: 700, color: T.ink, fontVariantNumeric: 'tabular-nums', letterSpacing: -0.5 }}>
                      {toDisplayWeight(startLb, units)}
                    </span>
                    <span style={{ fontSize: 12, color: T.mute }}>{u}</span>
                  </div>
                )}
              </div>
              {!editingStart && (
                <button className="tap" onClick={() => setEditingStart(true)} style={{
                  padding: '7px 14px', borderRadius: 14, background: T.bg, border: `1px solid ${T.hair2}`,
                  color: T.ink, fontSize: 12.5, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit',
                }}>Change</button>
              )}
            </div>
            {editingStart && (
              <Fragment>
                <div style={{ fontSize: 12, color: T.mute, lineHeight: 1.5, marginBottom: 12 }}>
                  This is the baseline your progress is measured against in Stats.
                </div>
                <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end' }}>
                  <Field
                    label="Starting weight"
                    value={startDraft}
                    onChange={e => setStartDraft(e.target.value.replace(/[^\d.]/g, ''))}
                    placeholder="0" suffix={u} type="number" flex={1}
                  />
                  <button className="tap" disabled={!startDraft} onClick={() => {
                    const sv = Math.round(Number(startDraft));
                    if (sv > 0) { onSetStart(fromDisplayWeight(sv, units)); setEditingStart(false); }
                  }} style={{
                    padding: '11px 18px', borderRadius: 10, border: 'none', height: 42,
                    background: startDraft ? T.ink : T.hair2, color: startDraft ? '#fff' : T.mute,
                    fontSize: 14, fontWeight: 600, fontFamily: 'inherit',
                    cursor: startDraft ? 'pointer' : 'default',
                  }}>Set</button>
                </div>
              </Fragment>
            )}
          </div>

          {/* Today's weigh-in */}
          <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, padding: '0 4px 8px' }}>
            {today ? "TODAY'S WEIGH-IN" : "LOG TODAY'S WEIGHT"}
          </div>
          <ValueEditor value={v} setValue={setV} unit={u} step={1} whole />

          {/* History */}
          <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, padding: '8px 4px 8px' }}>
            HISTORY · {sorted.length} ENTR{sorted.length === 1 ? 'Y' : 'IES'}
          </div>
          <div style={{ background: T.card, borderRadius: 16, border: `1px solid ${T.hair}`, overflow: 'hidden' }}>
            {sorted.length === 0 && (
              <div style={{ padding: '18px 16px', textAlign: 'center', color: T.mute, fontSize: 12.5 }}>
                No weigh-ins yet.
              </div>
            )}
            {sorted.slice(0, 30).map((w, i) => {
              const prev = sorted[i + 1];
              const delta = prev ? w.w - prev.w : null;
              return (
                <div key={w.date} className="defer" style={{
                  padding: '11px 14px', display: 'flex', alignItems: 'center', gap: 10,
                  borderTop: i > 0 ? `1px solid ${T.hair}` : 'none',
                }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13.5, color: T.ink, fontWeight: w.date === todayKey ? 600 : 500 }}>{fmt(w.date)}</div>
                    {delta !== null && toDisplayWeight(Math.abs(delta), units) >= 1 && (
                      <div style={{ fontSize: 11, color: delta < 0 ? T.good : T.warn, marginTop: 1, fontWeight: 600 }}>
                        {delta < 0 ? '−' : '+'}{toDisplayWeight(Math.abs(delta), units)} {u}
                      </div>
                    )}
                  </div>
                  <div style={{ fontSize: 14, fontWeight: 600, color: T.ink, fontVariantNumeric: 'tabular-nums' }}>
                    {toDisplayWeight(w.w, units)} {u}
                  </div>
                  <button className="tap" onClick={() => onRemoveWeight(w.date)} aria-label={`Delete weigh-in for ${fmt(w.date)}`} style={{
                    width: 30, height: 30, borderRadius: 15, background: 'none', border: 'none',
                    display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
                    color: T.mute, flexShrink: 0,
                  }}>{Ic.trash(16)}</button>
                </div>
              );
            })}
          </div>
        </SettingScreen>
      );
    }

    // Full-screen settings editors. These live at the app level rather than
    // inside the tab's scroll view: the tab wrapper animates a transform, which
    // would make it the containing block and collapse an absolutely positioned
    // child to zero height.
    function SettingsDetail({ screen, back, profile, setProfile, goals, setGoals, weights = [], onAddWeight, onRemoveWeight }) {
      const units = profile.units;
      const u = weightUnit(units);
      const sorted = [...weights].sort((a, b) => a.date.localeCompare(b.date));
      const latest = sorted.length ? sorted[sorted.length - 1] : null;
      const goalLb = Number(profile.goalWeight) || 0;
      const heightIn = Number(profile.heightIn) || 70;
      if (screen === 'weight') {
        return (
          <WeightSetting
            profile={profile} weights={weights} onBack={back}
            onAddWeight={onAddWeight} onRemoveWeight={onRemoveWeight}
            onSetStart={(lb) => setProfile({ ...profile, startWeight: lb })}
          />
        );
      }
      if (screen === 'name') {
        return (<TextSetting title="Name" value={profile.name} onBack={back}
          onSave={v => { setProfile({ ...profile, name: v }); back(); }} />);
      }
      if (screen === 'height') {
        const metric = units === 'metric';
        return (<NumberSetting
          title="Height"
          subtitle={metric ? 'Your height in centimetres.' : 'Your height in inches — 5′10″ is 70 in.'}
          value={Math.round(metric ? heightIn * 2.54 : heightIn)}
          unit={metric ? 'cm' : 'inches'} step={1} whole
          onBack={back}
          onSave={v => { setProfile({ ...profile, heightIn: metric ? v / 2.54 : v }); back(); }}
          footer={(n) => (
            <div style={{ fontSize: 12, color: T.mute, textAlign: 'center' }}>
              That's {fmtHeight(metric ? n / 2.54 : n, metric ? 'imperial' : 'metric')} in {metric ? 'feet and inches' : 'centimetres'}.
            </div>
          )}
        />);
      }
      if (screen === 'goalWeight') {
        return (<NumberSetting
          title="Goal weight"
          subtitle="Shown as a dashed line on your weight chart."
          value={toDisplayWeight(goalLb, units)} unit={u} step={1} whole
          onBack={back}
          onSave={v => { setProfile({ ...profile, goalWeight: fromDisplayWeight(v, units) }); back(); }}
          footer={(n) => latest ? (
            <div style={{ fontSize: 12, color: T.mute, textAlign: 'center' }}>
              {Math.abs(toDisplayWeight(latest.w, units) - n) < 0.5
                ? "You're at this weight now."
                : `${Math.abs(toDisplayWeight(latest.w, units) - n)} ${u} from your latest weigh-in.`}
            </div>
          ) : null}
        />);
      }
      if (screen === 'split') {
        return (<MacroSplitSetting goals={goals} onBack={back}
          onSave={(g) => { setGoals({ ...goals, ...g }); back(); }} />);
      }
      if (screen && screen.startsWith('goal:')) {
        const key = screen.slice(5);
        const meta = {
          cal: { title: 'Calorie target', unit: 'kcal per day', step: 10 },
          p: { title: 'Protein target', unit: 'grams per day', step: 1 },
          c: { title: 'Carb target', unit: 'grams per day', step: 1 },
          f: { title: 'Fat target', unit: 'grams per day', step: 1 },
          water: { title: 'Water target', unit: 'bottles per day', step: 1 },
        }[key];
        return (<NumberSetting
          title={meta.title}
          subtitle={key === 'cal'
            ? 'Your macro grams are rescaled to keep the same split when this changes.'
            : undefined}
          value={goals[key]} unit={meta.unit}
          step={meta.step} whole onBack={back}
          onSave={v => {
            // Changing calories keeps the split and moves the grams with it,
            // so the targets can't drift out of step with each other.
            if (key === 'cal' && macroKcal(goals) > 0) {
              setGoals({ ...goals, cal: v, ...splitToGrams(macroSplit(goals), v) });
            } else {
              setGoals({ ...goals, [key]: v });
            }
            back();
          }}
          footer={(n) => key === 'water' ? (
            <div style={{ fontSize: 12, color: T.mute, textAlign: 'center' }}>
              {bottleOz(n)} oz a day at {OZ_PER_BOTTLE} oz per bottle.
            </div>
          ) : key === 'cal' ? null : (
            <div style={{ fontSize: 12, color: T.mute, textAlign: 'center' }}>
              {num(Math.round(n * (key === 'f' ? 9 : 4)))} kcal from {meta.title.split(' ')[0].toLowerCase()}.
            </div>
          )}
        />);
      }

      return null;
    }

    // Macro split editor. You set percentages; grams are derived from the
    // calorie target so the two always agree. Save is blocked until the three
    // add up to 100%, which is what keeps the split honest.
    function MacroSplitSetting({ goals, onBack, onSave }) {
      const [split, setSplit] = useState(macroSplit(goals));
      const total = split.p + split.c + split.f;
      const ok = total === 100;
      const grams = ok ? splitToGrams(split, goals.cal) : null;
      const activePreset = SPLIT_PRESETS.find(pr =>
        pr.split.p === split.p && pr.split.c === split.c && pr.split.f === split.f);

      const bump = (key, d) => setSplit(prev => ({
        ...prev, [key]: Math.max(0, Math.min(100, prev[key] + d)),
      }));

      const rows = [
        { key: 'p', label: 'Protein', color: T.protein },
        { key: 'c', label: 'Carbs', color: T.carbs },
        { key: 'f', label: 'Fat', color: T.fat },
      ];

      return (
        <SettingScreen
          title="Macro split"
          subtitle={`Percentages of your ${num(goals.cal)} kcal target. Grams are worked out for you, and update automatically if you change your calorie target later.`}
          onBack={onBack}
          canSave={ok}
          saveLabel={ok ? `Save ${grams.p}g · ${grams.c}g · ${grams.f}g` : `Needs to total 100% (currently ${total}%)`}
          onSave={() => ok && onSave(grams)}
        >
          <div className="card" style={{
            background: T.card, borderRadius: 20, padding: '18px', border: `1px solid ${T.hair}`, marginBottom: 12,
          }}>
            <SplitBar title="Split" split={split} />
            <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
              {rows.map(r => (
                <div key={r.key} style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 7, width: 84, flexShrink: 0 }}>
                    <div style={{ width: 8, height: 8, borderRadius: 4, background: r.color }} />
                    <span style={{ fontSize: 13.5, color: T.ink, fontWeight: 500 }}>{r.label}</span>
                  </div>
                  <button className="tap" onClick={() => bump(r.key, -5)} aria-label={`Decrease ${r.label}`} style={{
                    width: 36, height: 36, borderRadius: 18, background: T.bg, border: `1px solid ${T.hair2}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
                    color: T.ink, flexShrink: 0,
                  }}>{Ic.minus(18)}</button>
                  <div style={{ flex: 1, textAlign: 'center', minWidth: 0 }}>
                    <div style={{ fontSize: 20, fontWeight: 700, color: T.ink, fontVariantNumeric: 'tabular-nums', letterSpacing: -0.4 }}>
                      {split[r.key]}%
                    </div>
                    <div style={{ fontSize: 10.5, color: T.mute, fontVariantNumeric: 'tabular-nums' }}>
                      {Math.round((goals.cal * (split[r.key] / 100)) / KCAL_PER_G[r.key])} g
                    </div>
                  </div>
                  <button className="tap" onClick={() => bump(r.key, 5)} aria-label={`Increase ${r.label}`} style={{
                    width: 36, height: 36, borderRadius: 18, background: T.ink, border: 'none',
                    display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
                    color: '#fff', flexShrink: 0,
                  }}>{Ic.plus(18)}</button>
                </div>
              ))}
            </div>
            <div style={{
              marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.hair}`,
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            }}>
              <span style={{ fontSize: 12, color: T.mute, fontWeight: 500 }}>Total</span>
              <span style={{
                fontSize: 15, fontWeight: 700, fontVariantNumeric: 'tabular-nums',
                color: ok ? T.good : T.warn,
              }}>{total}%</span>
            </div>
          </div>

          <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, padding: '4px 4px 8px' }}>
            COMMON SPLITS
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 12 }}>
            {SPLIT_PRESETS.map(pr => {
              const on = activePreset && activePreset.key === pr.key;
              return (
                <button key={pr.key} className="tap" onClick={() => setSplit(pr.split)} style={{
                  padding: '12px', borderRadius: 14, textAlign: 'left',
                  background: on ? T.ink : T.card,
                  border: `1px solid ${on ? T.ink : T.hair}`,
                  cursor: 'pointer', fontFamily: 'inherit',
                }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600, color: on ? '#fff' : T.ink }}>{pr.label}</div>
                  <div style={{
                    fontSize: 11, marginTop: 2, fontVariantNumeric: 'tabular-nums',
                    color: on ? 'rgba(255,255,255,0.7)' : T.mute,
                  }}>{pr.split.p}/{pr.split.c}/{pr.split.f}</div>
                </button>
              );
            })}
          </div>
          {activePreset && (
            <div style={{ fontSize: 12, color: T.mute, lineHeight: 1.5, textAlign: 'center', padding: '0 8px' }}>
              {activePreset.note}
            </div>
          )}
        </SettingScreen>
      );
    }

    function Profile({ profile, goals, weights = [], setProfile, onOpenSetting, onResetData }) {
      const units = profile.units;
      const u = weightUnit(units);
      const sorted = [...weights].sort((a, b) => a.date.localeCompare(b.date));
      const latest = sorted.length ? sorted[sorted.length - 1] : null;
      const goalLb = Number(profile.goalWeight) || 0;
      const heightIn = Number(profile.heightIn) || 70;
      const startLb = Number(profile.startWeight) || (sorted.length ? sorted[0].w : 0);
      const changeLb = latest && startLb ? latest.w - startLb : 0;
      const setScreen = onOpenSetting;

      // ── Settings list ────────────────────────────────────────────────
      const subtitle = latest
        ? (goalLb
            ? (Math.abs(latest.w - goalLb) < 1
                ? 'At your goal weight'
                : `${toDisplayWeight(Math.abs(latest.w - goalLb), units)} ${u} ${latest.w > goalLb ? 'to lose' : 'to gain'}`)
            : 'Set a goal weight below')
        : 'Log your first weigh-in below';
      const initial = (profile.name || 'A').trim()[0].toUpperCase();
      const macroTotal = Math.round(macroKcal(goals));
      // Rounding grams to whole numbers can't always land exactly on the target
      const macrosMatch = Math.abs(macroTotal - goals.cal) <= 20;
      const split = macroSplit(goals);

      return (
        <div className="screen" style={{ padding: '8px 20px 120px' }}>
          <div style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>PROFILE</div>
            <div style={{ fontSize: 26, fontWeight: 700, color: T.ink, letterSpacing: -0.6, marginTop: 2 }}>You</div>
          </div>

          <div className="card" style={{
            background: T.card, borderRadius: 20, padding: '18px', border: `1px solid ${T.hair}`, marginBottom: 14,
            display: 'flex', alignItems: 'center', gap: 14,
          }}>
            <div style={{
              width: 56, height: 56, borderRadius: 28, background: T.ink,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 22, fontWeight: 700, color: '#fff', flexShrink: 0,
            }}>{initial}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 17, fontWeight: 700, color: T.ink, letterSpacing: -0.3 }}>{profile.name}</div>
              <div style={{ fontSize: 12, color: T.mute, marginTop: 2 }}>{subtitle}</div>
            </div>
          </div>

          <div className="card" style={{
            background: T.card, borderRadius: 20, padding: '18px', border: `1px solid ${T.hair}`, marginBottom: 14,
          }}>
            <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, marginBottom: 12 }}>YOUR STATS</div>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <PStat
                label="Weight"
                value={latest ? String(toDisplayWeight(latest.w, units)) : '—'}
                unit={latest ? u : ''}
                trend={latest && startLb && toDisplayWeight(Math.abs(changeLb), units) >= 1
                  ? `${changeLb < 0 ? '−' : '+'}${toDisplayWeight(Math.abs(changeLb), units)}`
                  : null}
                trendColor={(() => {
                  if (!goalLb || changeLb === 0) return T.mute;
                  const wantsGain = goalLb > startLb;
                  return (wantsGain ? changeLb > 0 : changeLb < 0) ? T.good : T.warn;
                })()}
              />
              <div style={{ width: 1, background: T.hair }} />
              <PStat label="Height" value={fmtHeight(heightIn, units).replace(' cm', '')} unit={units === 'metric' ? 'cm' : ''} />
              <div style={{ width: 1, background: T.hair }} />
              <PStat label="Goal" value={goalLb ? String(toDisplayWeight(goalLb, units)) : '—'} unit={goalLb ? u : ''} />
            </div>
          </div>

          <Section title="Daily Targets">
            <NavRow label="Calories" value={`${num(goals.cal)} kcal`} onClick={() => setScreen('goal:cal')} first />
            <NavRow label="Protein" value={`${goals.p} g`} onClick={() => setScreen('goal:p')} />
            <NavRow label="Carbs" value={`${goals.c} g`} onClick={() => setScreen('goal:c')} />
            <NavRow label="Fat" value={`${goals.f} g`} onClick={() => setScreen('goal:f')} />
            <NavRow label="Water" value={`${goals.water} bottle${goals.water === 1 ? '' : 's'}`} onClick={() => setScreen('goal:water')} />
            <NavRow label="Macro split" value={`${split.p}/${split.c}/${split.f}`} onClick={() => setScreen('split')} />
          </Section>

          <div style={{ margin: '-4px 0 14px', padding: '0 4px', fontSize: 11, color: macrosMatch ? T.mute : T.warn, lineHeight: 1.5 }}>
            {macrosMatch
              ? `Macros add up to ${num(macroTotal)} kcal, matching your calorie target.`
              : `Macros add up to ${num(macroTotal)} kcal — ${num(Math.abs(macroTotal - goals.cal))} ${macroTotal > goals.cal ? 'above' : 'below'} your ${num(goals.cal)} kcal target. Adjust the split to line them up.`}
          </div>

          <Section title="Body">
            <NavRow label="Name" value={profile.name} onClick={() => setScreen('name')} first />
            <NavRow
              label="Weight"
              value={latest ? `${toDisplayWeight(latest.w, units)} ${u}` : 'Not set'}
              onClick={() => setScreen('weight')}
            />
            <NavRow label="Height" value={fmtHeight(heightIn, units)} onClick={() => setScreen('height')} />
            <NavRow label="Goal weight" value={goalLb ? `${toDisplayWeight(goalLb, units)} ${u}` : 'Not set'} onClick={() => setScreen('goalWeight')} />
          </Section>

          <Section title="Preferences">
            <Row label="Units">
              <div style={{ display: 'flex', gap: 2, background: T.bg, borderRadius: 8, padding: 2 }}>
                {['imperial', 'metric'].map(x => (
                  <button key={x} className="tap" onClick={() => setProfile({ ...profile, units: x })} style={{
                    padding: '6px 11px', background: units === x ? T.ink : 'transparent',
                    color: units === x ? '#fff' : T.ink2, fontSize: 11, fontWeight: 600,
                    border: 'none', borderRadius: 6, cursor: 'pointer', textTransform: 'capitalize',
                    fontFamily: 'inherit',
                  }}>{x}</button>
                ))}
              </div>
            </Row>
          </Section>

          <Section title="Data">
            <Row label="Reset all data" onClick={onResetData} labelColor={T.warn} />
          </Section>

          <div style={{ textAlign: 'center', marginTop: 20, fontSize: 10, color: T.mute, letterSpacing: 0.4 }}>
            MACRO · v3.1
          </div>
        </div>
      );
    }

    // List row that drills into a detail screen.
    function NavRow({ label, value, onClick, first }) {
      return (
        <button className="row-tap" onClick={onClick} style={{
          width: '100%', padding: '13px 16px', background: 'none', textAlign: 'left',
          border: 'none', borderTop: first ? 'none' : `1px solid ${T.hair}`,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          cursor: 'pointer', fontFamily: 'inherit', gap: 12,
        }}>
          <span style={{ fontSize: 14, color: T.ink, fontWeight: 500 }}>{label}</span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 6, minWidth: 0 }}>
            <span style={{
              fontSize: 13, color: T.mute, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
            }}>{value}</span>
            {Ic.chevR(14, T.mute)}
          </span>
        </button>
      );
    }

    function PStat({ label, value, unit, trend, trendColor }) {
      return (
        <div style={{ flex: 1, textAlign: 'center' }}>
          <div style={{ fontSize: 10.5, color: T.mute, fontWeight: 600, letterSpacing: 0.5, marginBottom: 4 }}>{label.toUpperCase()}</div>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'center', gap: 3 }}>
            <span style={{ fontSize: 20, fontWeight: 700, color: T.ink, fontVariantNumeric: 'tabular-nums', letterSpacing: -0.4 }}>{value}</span>
            {unit && <span style={{ fontSize: 10, color: T.mute }}>{unit}</span>}
          </div>
          {trend && <div style={{ fontSize: 10, color: trendColor || T.good, fontWeight: 600, marginTop: 2 }}>{trend}</div>}
        </div>
      );
    }

    function Section({ title, children }) {
      return (
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, padding: '0 4px 8px' }}>{title.toUpperCase()}</div>
          <div style={{ background: T.card, borderRadius: 16, border: `1px solid ${T.hair}`, overflow: 'hidden' }}>
            {children}
          </div>
        </div>
      );
    }

    function Row({ label, value, children, labelColor, valueColor, onClick }) {
      return (
        <div onClick={onClick} className={onClick ? 'row-tap' : undefined} style={{
          padding: '13px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          borderTop: `1px solid ${T.hair}`,
          cursor: onClick ? 'pointer' : 'default',
        }}>
          <span style={{ fontSize: 14, color: labelColor || T.ink, fontWeight: 500 }}>{label}</span>
          {children || (
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              {value && <span style={{ fontSize: 13, color: valueColor || T.mute }}>{value}</span>}
              {Ic.chevR(14, T.mute)}
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // Onboarding
    // ═══════════════════════════════════════════════════════════════
    // Shown on a first run and after a reset. Everything here is a starting
    // point you can change later in Settings — nothing is calculated for you.
    function Onboarding({ onFinish }) {
      const [step, setStep] = useState(0);
      const [units, setUnits] = useState('imperial');
      const [name, setName] = useState('');
      const [height, setHeight] = useState('');
      const [weight, setWeight] = useState('');
      const [goalWeight, setGoalWeight] = useState('');
      const [cal, setCal] = useState(String(DEFAULT_GOALS.cal));
      const [p, setP] = useState(String(DEFAULT_GOALS.p));
      const [c, setC] = useState(String(DEFAULT_GOALS.c));
      const [f, setF] = useState(String(DEFAULT_GOALS.f));
      const [water, setWater] = useState(String(DEFAULT_GOALS.water));

      const metric = units === 'metric';
      const u = weightUnit(units);
      const n = (v) => (v === '' ? NaN : Number(v));
      const pos = (v) => { const x = n(v); return isFinite(x) && x > 0; };
      const digits = (setter) => (e) => setter(e.target.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1'));

      const steps = [
        {
          title: 'Welcome to Macro',
          blurb: 'A few quick questions so your targets and progress start from the right place. You can change any of it later.',
          valid: name.trim().length > 0,
        },
        {
          title: 'About you',
          blurb: 'Your current weight becomes your starting point, and today\u2019s first weigh-in.',
          valid: pos(height) && pos(weight) && pos(goalWeight),
        },
        {
          title: 'Daily targets',
          blurb: 'These are pre-filled with common defaults. Set whatever suits you \u2014 they\u2019re yours to adjust any time.',
          valid: [cal, p, c, f, water].every(pos),
        },
      ];
      const cur = steps[step];
      const last = step === steps.length - 1;

      const finish = () => {
        const r = (v) => Math.round(n(v));
        const wLb = fromDisplayWeight(r(weight), units);
        onFinish({
          profile: {
            name: name.trim(),
            heightIn: metric ? r(height) / 2.54 : r(height),
            goalWeight: fromDisplayWeight(r(goalWeight), units),
            startWeight: wLb,
            units,
          },
          goals: { cal: r(cal), p: r(p), c: r(c), f: r(f), water: r(water) },
          weight: wLb,
        });
      };

      const card = (children) => (
        <div className="card" style={{
          background: T.card, borderRadius: 20, padding: '18px', border: `1px solid ${T.hair}`,
          marginBottom: 12, display: 'flex', flexDirection: 'column', gap: 14,
        }}>{children}</div>
      );

      return (
        <div style={{ height: '100%', background: T.bg, display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: '54px 20px 10px' }}>
            <div style={{ display: 'flex', gap: 6, marginBottom: 18 }}>
              {steps.map((_, i) => (
                <div key={i} style={{
                  flex: 1, height: 4, borderRadius: 2,
                  background: i <= step ? T.ink : T.hair2,
                  transition: 'background 300ms ease',
                }} />
              ))}
            </div>
            <div key={step} className="screen">
              <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>
                STEP {step + 1} OF {steps.length}
              </div>
              <div style={{ fontSize: 26, fontWeight: 700, color: T.ink, letterSpacing: -0.6, marginTop: 2 }}>
                {cur.title}
              </div>
              <div style={{ fontSize: 13, color: T.mute, lineHeight: 1.5, marginTop: 8 }}>{cur.blurb}</div>
            </div>
          </div>

          <div className="scroll" key={'body' + step} style={{ flex: 1, overflowY: 'auto', padding: '14px 20px 24px' }}>
            {step === 0 && card(
              <Fragment>
                <Field label="Your name" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Abel" autoFocus />
                <div>
                  <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, marginBottom: 8 }}>UNITS</div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    {['imperial', 'metric'].map(x => (
                      <button key={x} className="tap" onClick={() => setUnits(x)} style={{
                        flex: 1, padding: '11px', borderRadius: 10,
                        background: units === x ? T.ink : T.bg,
                        color: units === x ? '#fff' : T.ink2,
                        border: `1px solid ${units === x ? T.ink : T.hair2}`,
                        fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit',
                        textTransform: 'capitalize',
                      }}>{x === 'imperial' ? 'Imperial (lb, in)' : 'Metric (kg, cm)'}</button>
                    ))}
                  </div>
                </div>
              </Fragment>
            )}

            {step === 1 && (
              <Fragment>
                {card(
                  <Fragment>
                    <Field
                      label="Height" value={height} onChange={digits(setHeight)}
                      placeholder={metric ? '178' : '70'} suffix={metric ? 'cm' : 'in'} type="number" autoFocus
                    />
                    <Field
                      label="Current weight" value={weight} onChange={digits(setWeight)}
                      placeholder={metric ? '78' : '172'} suffix={u} type="number"
                    />
                    <Field
                      label="Goal weight" value={goalWeight} onChange={digits(setGoalWeight)}
                      placeholder={metric ? '75' : '165'} suffix={u} type="number"
                    />
                  </Fragment>
                )}
                {pos(weight) && pos(goalWeight) && (
                  <div style={{ fontSize: 12, color: T.mute, textAlign: 'center', lineHeight: 1.5 }}>
                    {Math.abs(n(weight) - n(goalWeight)) < 0.5
                      ? 'You\u2019re at your goal weight — Macro will track you staying there.'
                      : `${Math.round(Math.abs(n(weight) - n(goalWeight)))} ${u} between where you are and where you\u2019re headed.`}
                  </div>
                )}
              </Fragment>
            )}

            {step === 2 && (
              <Fragment>
                {card(
