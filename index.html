                  <Fragment>
                    <Field label="Daily calories" value={cal} onChange={digits(setCal)} placeholder="2200" suffix="kcal" type="number" autoFocus />
                    <div style={{ display: 'flex', gap: 10 }}>
                      <Field label="Protein" value={p} onChange={digits(setP)} placeholder="165" suffix="g" type="number" flex={1} />
                      <Field label="Carbs" value={c} onChange={digits(setC)} placeholder="220" suffix="g" type="number" flex={1} />
                      <Field label="Fat" value={f} onChange={digits(setF)} placeholder="73" suffix="g" type="number" flex={1} />
                    </div>
                    <Field label="Water" value={water} onChange={digits(setWater)} placeholder="4" suffix={`bottles (${OZ_PER_BOTTLE} oz each)`} type="number" />
                  </Fragment>
                )}
                {[p, c, f].every(pos) && (
                  <div style={{ fontSize: 12, color: T.mute, textAlign: 'center', lineHeight: 1.5 }}>
                    Those macros add up to {num(Math.round(n(p) * 4 + n(c) * 4 + n(f) * 9))} kcal.
                  </div>
                )}
                <div style={{ fontSize: 11.5, color: T.mute, textAlign: 'center', lineHeight: 1.5, marginTop: 12 }}>
                  Not sure what to put here? A doctor or dietitian can help you land on numbers that fit you.
                </div>
              </Fragment>
            )}
          </div>

          <div style={{ padding: '12px 20px 32px', borderTop: `1px solid ${T.hair}`, background: T.card, display: 'flex', gap: 10 }}>
            {step > 0 && (
              <button className="tap" onClick={() => setStep(step - 1)} style={{
                padding: '15px 20px', borderRadius: 16, background: T.bg, border: `1px solid ${T.hair2}`,
                color: T.ink, fontWeight: 600, fontSize: 15, cursor: 'pointer', fontFamily: 'inherit',
              }}>Back</button>
            )}
            <button
              className="tap"
              disabled={!cur.valid}
              onClick={() => (last ? finish() : setStep(step + 1))}
              style={{
                flex: 1, padding: '15px', borderRadius: 16, border: 'none',
                background: cur.valid ? T.ink : T.hair2, color: cur.valid ? '#fff' : T.mute,
                fontWeight: 600, fontSize: 15, fontFamily: 'inherit',
                cursor: cur.valid ? 'pointer' : 'default',
              }}>
              {last ? 'Start tracking' : 'Continue'}
            </button>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // Toast
    // ═══════════════════════════════════════════════════════════════
    function Toast({ msg }) {
      if (!msg) return null;
      return (
        <div style={{
          position: 'absolute', bottom: 100, left: '50%', transform: 'translateX(-50%)',
          background: T.ink, color: '#fff', padding: '10px 18px', borderRadius: 999,
          fontSize: 13, fontWeight: 500, zIndex: 200,
          display: 'flex', alignItems: 'center', gap: 6,
          animation: 'toastIn 200ms ease-out',
          boxShadow: '0 8px 24px rgba(0,0,0,0.25)',
        }}>
          {Ic.check(16, '#fff')}
          <span>{msg}</span>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // App shell
    // ═══════════════════════════════════════════════════════════════
    const STORAGE_KEY = 'macro-app-v4';
    const LEGACY_V3_KEY = 'macro-app-v3';
    const LEGACY_V2_KEY = 'macro-app-v2';

    // v3 and earlier counted water in 8 oz cups; v4 counts 16.9 oz bottles.
    const cupsToBottles = (cups) => Math.max(0, Math.round((cups * 8) / OZ_PER_BOTTLE));
    const LEGACY_KEY = 'macro-app-v1';
    const DEFAULT_TODAY_ENTRIES = [
      { ...FOOD_DB[0], qty: 1, meal: 'Breakfast', uid: 'e1' },
      { ...FOOD_DB[1], qty: 1, meal: 'Breakfast', uid: 'e2' },
      { ...FOOD_DB[2], qty: 1, meal: 'Breakfast', uid: 'e3' },
      { ...FOOD_DB[8], qty: 1, meal: 'Breakfast', uid: 'e4' },
      { ...FOOD_DB[7], qty: 1, meal: 'Lunch', uid: 'e5' },
      { ...FOOD_DB[4], qty: 1, meal: 'Lunch', uid: 'e6' },
      { ...FOOD_DB[9], qty: 1, meal: 'Lunch', uid: 'e7' },
      { ...FOOD_DB[6], qty: 1, meal: 'Lunch', uid: 'e8' },
    ];

    // Date helpers — work in local time so "today" matches the device clock.
    const dateKey = (d = new Date()) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };
    const parseDateKey = (k) => {
      const [y, m, d] = k.split('-').map(Number);
      return new Date(y, m - 1, d);
    };
    const addDays = (d, n) => {
      const r = new Date(d);
      r.setDate(r.getDate() + n);
      return r;
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
        // Migrate v3: convert every stored water count from cups to bottles.
        const v3 = localStorage.getItem(LEGACY_V3_KEY);
        if (v3) {
          const old = JSON.parse(v3);
          const waterByDate = {};
          Object.entries(old.waterByDate || {}).forEach(([k, v]) => { waterByDate[k] = cupsToBottles(v); });
          return {
            ...old,
            waterByDate,
            goals: { ...DEFAULT_GOALS, ...(old.goals || {}), water: cupsToBottles((old.goals || {}).water ?? 8) },
            // Baseline the starting weight on their oldest real weigh-in, not the demo default.
            profile: {
              ...DEFAULT_PROFILE,
              ...(old.profile || {}),
              startWeight: (old.profile || {}).startWeight
                ?? ([...(old.weights || [])].sort((a, b) => a.date.localeCompare(b.date))[0] || {}).w
                ?? DEFAULT_PROFILE.startWeight,
            },
          };
        }
        // Migrate v2 (same food/water shape, no goals/weights/workouts yet).
        const v2 = localStorage.getItem(LEGACY_V2_KEY);
        if (v2) {
          const old = JSON.parse(v2);
          const waterByDate = {};
          Object.entries(old.waterByDate || {}).forEach(([k, v]) => { waterByDate[k] = cupsToBottles(v); });
          return { ...old, waterByDate, goals: { ...DEFAULT_GOALS }, profile: { ...DEFAULT_PROFILE }, weights: [], workoutsByDate: {} };
        }
        // Migrate from v1 if present (treat the old flat entries/water as today's bucket).
        const legacy = localStorage.getItem(LEGACY_KEY);
        if (legacy) {
          const old = JSON.parse(legacy);
          const todayKey = dateKey();
          return {
            entriesByDate: { [todayKey]: old.entries || DEFAULT_TODAY_ENTRIES },
            waterByDate: { [todayKey]: cupsToBottles(old.water ?? 5) },
            customFoods: old.customFoods || [],
            favorites: old.favorites || DEFAULT_FAVORITE_IDS,
            uidCounter: old.uidCounter || 100,
            customFoodCounter: old.customFoodCounter || 1,
            goals: { ...DEFAULT_GOALS },
            profile: { ...DEFAULT_PROFILE },
            weights: [],
            workoutsByDate: {},
          };
        }
        return null;
      } catch { return null; }
    }

    function saveState(s) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}
    }

    function App() {
      const saved = loadState();
      const todayKey = dateKey();

      const [tab, setTab] = useState('home');
      // First run (or a reset) starts with the welcome flow instead of demo data.
      const [onboarding, setOnboarding] = useState(!saved);
      const [settingScreen, setSettingScreen] = useState(null);
      const [addingMeal, setAddingMeal] = useState(null);
      const [scanning, setScanning] = useState(false);
      const [scanEdit, setScanEdit] = useState(null); // scanned food being corrected
      const [foodDetail, setFoodDetail] = useState(null);

      // Date-keyed history. Seed today's bucket with defaults on first run.
      const [entriesByDate, setEntriesByDate] = useState(
        saved?.entriesByDate || (saved ? {} : { [todayKey]: [] })
      );
      const [waterByDate, setWaterByDate] = useState(
        saved?.waterByDate || { [todayKey]: 0 }
      );
      const [selectedDate, setSelectedDate] = useState(todayKey);

      // Manually logged workouts, keyed by date, same shape as entries.
      const [workoutsByDate, setWorkoutsByDate] = useState(saved?.workoutsByDate || {});

      // Editable targets + body profile + weigh-in history (weights in lb).
      const [goals, setGoals] = useState({ ...DEFAULT_GOALS, ...(saved?.goals || {}) });
      const [profile, setProfile] = useState({ ...DEFAULT_PROFILE, ...(saved?.profile || {}) });
      const [weights, setWeights] = useState(saved?.weights || []);

      // Publish the current targets so every screen reads the user's numbers.
      GOAL = goals;

      const [customFoods, setCustomFoods] = useState(saved?.customFoods || []);
      const [favorites, setFavorites] = useState(new Set(saved?.favorites || DEFAULT_FAVORITE_IDS));
      const [toast, setToast] = useState(null);
      const uidRef = useRef(saved?.uidCounter || 100);
      const customFoodRef = useRef(saved?.customFoodCounter || ((saved?.customFoods?.length || 0) + 1));
      const foods = useMemo(() => [...FOOD_DB, ...customFoods], [customFoods]);

      // Entries/water for the currently selected date
      const entries = entriesByDate[selectedDate] || [];
      const water = waterByDate[selectedDate] ?? 0;

      // Setters scoped to the selected date
      const setEntries = (updater) => {
        setEntriesByDate(prev => {
          const cur = prev[selectedDate] || [];
          const next = typeof updater === 'function' ? updater(cur) : updater;
          return { ...prev, [selectedDate]: next };
        });
      };
      const setWater = (val) => {
        setWaterByDate(prev => {
          const cur = prev[selectedDate] ?? 0;
          const next = typeof val === 'function' ? val(cur) : val;
          return { ...prev, [selectedDate]: next };
        });
      };

      // Workouts for the currently selected date
      const workouts = workoutsByDate[selectedDate] || [];

      const handleAddWorkout = (w) => {
        uidRef.current += 1;
        const uid = 'w' + uidRef.current;
        setWorkoutsByDate(prev => ({
          ...prev,
          [selectedDate]: [...(prev[selectedDate] || []), { ...w, uid }],
        }));
        showToast(`Logged ${w.name}`);
      };

      const handleRemoveWorkout = (uid) => {
        setWorkoutsByDate(prev => ({
          ...prev,
          [selectedDate]: (prev[selectedDate] || []).filter(w => w.uid !== uid),
        }));
        showToast('Workout removed');
      };

      // Applies everything from the welcome flow in one go.
      const handleFinishOnboarding = ({ profile: p, goals: g, weight }) => {
        setProfile({ ...DEFAULT_PROFILE, ...p });
        setGoals(g);
        setWeights([{ date: dateKey(), w: weight }]);
        setOnboarding(false);
        showToast(`Welcome, ${p.name.split(' ')[0]}`);
      };

      const handleRemoveWeight = (date) => {
        setWeights(prev => prev.filter(w => w.date !== date));
        showToast('Weigh-in removed');
      };

      // One weigh-in per day — logging again today overwrites it.
      const handleAddWeight = (lb) => {
        const k = dateKey();
        setWeights(prev => [...prev.filter(x => x.date !== k), { date: k, w: lb }]
          .sort((a, b) => a.date.localeCompare(b.date)));
        showToast('Weight logged');
      };

      // Persist
      useEffect(() => {
        saveState({
          entriesByDate, waterByDate, workoutsByDate, customFoods,
          goals, profile, weights,
          favorites: Array.from(favorites),
          uidCounter: uidRef.current, customFoodCounter: customFoodRef.current,
        });
      }, [entriesByDate, waterByDate, workoutsByDate, customFoods, favorites, goals, profile, weights]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 1800);
      };

      // The Today tab is always today — if you were browsing a past day in the
      // diary, jump the selection back so the header and the data agree.
      const handleSetTab = (k) => {
        if (k === 'home') setSelectedDate(dateKey());
        setTab(k);
      };

      const openAdd = (meal = 'Breakfast') => setAddingMeal(meal);

      const handlePickFood = (food) => {
        setFoodDetail({ food, meal: addingMeal, qty: 1 });
        setAddingMeal(null);
      };

      const handleCreateCustomFood = ({ food, qty, meal, favorite }) => {
        const nextFood = { ...food, id: 'custom-' + customFoodRef.current };
        customFoodRef.current += 1;
        uidRef.current += 1;
        const newUid = 'u' + uidRef.current;
        setCustomFoods(prev => [nextFood, ...prev]);
        if (favorite) setFavorites(prev => new Set([...prev, nextFood.id]));
        setEntries(prev => [...prev, { ...nextFood, qty, meal, uid: newUid }]);
        setAddingMeal(null);
        showToast(`Added ${nextFood.name}`);
      };

      const handleLog = (entry) => {
        const isUpdate = entry.uid && entries.some(e => e.uid === entry.uid);
        let newUid = entry.uid;
        if (!isUpdate) {
          uidRef.current += 1;
          newUid = 'u' + uidRef.current;
        }
        setEntries(prev => {
          if (entry.uid && prev.some(e => e.uid === entry.uid)) {
            return prev.map(e => e.uid === entry.uid ? entry : e);
          }
          return [...prev, { ...entry, uid: newUid }];
        });
        setFoodDetail(null);
        setScanning(false);
        showToast(isUpdate ? 'Item updated' : `Added to ${entry.meal}`);
      };

      const handleRemoveEntry = (uid) => {
        setEntries(prev => prev.filter(e => e.uid !== uid));
        setFoodDetail(null);
        showToast('Item removed');
      };

      const handleToggleFav = (id) => {
        setFavorites(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      };

      const handleResetData = () => {
        if (confirm('Reset all data? Your food log, workouts, weigh-ins and targets will be cleared, and you\'ll set everything up fresh. This cannot be undone.')) {
          const k = dateKey();
          setEntriesByDate({ [k]: [] });
          setWaterByDate({ [k]: 0 });
          setWorkoutsByDate({});
          setWeights([]);
          setGoals({ ...DEFAULT_GOALS });
          setProfile({ ...DEFAULT_PROFILE });
          setSelectedDate(k);
          setSettingScreen(null);
          setTab('home');
          setOnboarding(true);
          setCustomFoods([]);
          setFavorites(new Set(DEFAULT_FAVORITE_IDS));
          uidRef.current = 100;
          customFoodRef.current = 1;
        }
      };

      let main;
      if (tab === 'home') main = <Dashboard entries={entries} workouts={workouts} water={water} setWater={setWater}
                                            profile={profile}
                                            onOpenFood={(it) => setFoodDetail({ food: it, meal: it.meal, qty: it.qty, uid: it.uid })}
                                            onAdd={openAdd} />;
      else if (tab === 'diary') main = <Diary
                                              entriesByDate={entriesByDate}
                                              waterByDate={waterByDate}
                                              workoutsByDate={workoutsByDate}
                                              selectedDate={selectedDate}
                                              setSelectedDate={setSelectedDate}
                                              setWater={setWater}
                                              onAddFood={openAdd}
                                              onAddWorkout={handleAddWorkout}
                                              onRemoveWorkout={handleRemoveWorkout}
                                              onOpenFood={(it) => setFoodDetail({ food: it, meal: it.meal, qty: it.qty, uid: it.uid })} />;
      else if (tab === 'stats') main = <Stats entriesByDate={entriesByDate} waterByDate={waterByDate}
                                              workoutsByDate={workoutsByDate} weights={weights} profile={profile} />;
      else if (tab === 'profile') main = <Profile
                                              profile={profile} setProfile={setProfile}
                                              goals={goals} weights={weights}
                                              onOpenSetting={setSettingScreen}
                                              onResetData={handleResetData} />;

      return (
        <div className="stage" style={{
          minHeight: '100vh', background: '#E8E6E0',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          padding: 24,
        }}>
          <IOSDevice width={402} height={874}>
            <div style={{ height: '100%', overflow: 'hidden', position: 'relative', background: T.bg }}>
              <div className="scroll" style={{ height: '100%', overflowY: 'auto', paddingTop: 54 }}>
                <div key={tab} className="screen">{main}</div>
              </div>

              {!addingMeal && !scanning && !scanEdit && !foodDetail && !settingScreen && !onboarding && (
                <TabBar tab={tab} setTab={handleSetTab} onAdd={() => openAdd('Breakfast')} />
              )}

              {settingScreen && (
                <div className="sheet" style={{ position: 'absolute', inset: 0, background: T.bg, zIndex: 90 }}>
                  <SettingsDetail
                    screen={settingScreen}
                    back={() => setSettingScreen(null)}
                    profile={profile} setProfile={setProfile}
                    goals={goals} setGoals={setGoals}
                    weights={weights}
                    onAddWeight={handleAddWeight}
                    onRemoveWeight={handleRemoveWeight}
                  />
                </div>
              )}

              {onboarding && (
                <div style={{ position: 'absolute', inset: 0, background: T.bg, zIndex: 150 }}>
                  <Onboarding onFinish={handleFinishOnboarding} />
                </div>
              )}

              {addingMeal && (
                <div className="sheet" style={{ position: 'absolute', inset: 0, background: T.bg, zIndex: 100 }}>
                  <AddFood
                    meal={addingMeal}
                    foods={foods}
                    customFoods={customFoods}
                    favorites={favorites}
                    onClose={() => setAddingMeal(null)}
                    onPickFood={handlePickFood}
                    onScan={() => { setAddingMeal(null); setScanning(true); }}
                    onCreateFood={handleCreateCustomFood}
                  />
                </div>
              )}

              {scanning && (
                <div style={{ position: 'absolute', inset: 0, zIndex: 110 }}>
                  <Scanner
                    foods={foods}
                    onClose={() => setScanning(false)}
                    onMatch={(f) => { setScanning(false); setFoodDetail({ food: f, meal: 'Snacks', qty: 1 }); }}
                    onEdit={(f) => { setScanning(false); setScanEdit(f); }}
                  />
                </div>
              )}

              {scanEdit && (
                <div className="sheet" style={{ position: 'absolute', inset: 0, background: T.bg, zIndex: 115 }}>
                  <CustomFoodForm
                    meal="Snacks"
                    initial={scanEdit}
                    onBack={() => { setScanEdit(null); setScanning(true); }}
                    onCreate={(payload) => { setScanEdit(null); handleCreateCustomFood(payload); }}
                  />
                </div>
              )}

              {foodDetail && (
                <div className="sheet" style={{ position: 'absolute', inset: 0, zIndex: 120 }}>
                  <FoodDetail
                    food={foodDetail.food}
                    defaultMeal={foodDetail.meal}
                    defaultQty={foodDetail.qty || 1}
                    favorites={favorites}
                    onClose={() => setFoodDetail(null)}
                    onLog={(entry) => handleLog({ ...entry, uid: foodDetail.uid })}
                    onRemove={foodDetail.uid ? () => handleRemoveEntry(foodDetail.uid) : null}
                    onToggleFav={handleToggleFav}
                  />
                </div>
              )}

              <Toast msg={toast} />
            </div>
          </IOSDevice>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
