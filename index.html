<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="images/app-icon.jpg">
  <link rel="apple-touch-icon-precomposed" href="images/app-icon.jpg">
  <link rel="icon" type="image/jpeg" href="images/app-icon.jpg">
  <title>Macro — Calorie Counter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; touch-action: manipulation; }
    body {
      background: #E8E6E0;
      font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }
    button { font-family: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
    @keyframes scanLine {
      0% { top: 8px; }
      50% { top: calc(100% - 8px); }
      100% { top: 8px; }
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: none; }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: none; }
    }
    /* Screen transition when switching tabs */
    .screen { animation: fadeUp 240ms cubic-bezier(.2,.8,.2,1) both; }
    /* Full-screen overlays (add food, scanner, detail) slide up from the bottom */
    .sheet { animation: sheetUp 300ms cubic-bezier(.2,.9,.25,1) both; will-change: transform; }
    .pop { animation: popIn 200ms cubic-bezier(.2,.8,.2,1) both; }
    /* Consistent tactile feedback without a per-button style object */
    .tap { transition: transform 120ms cubic-bezier(.2,.8,.2,1), background 160ms ease, border-color 160ms ease, opacity 160ms ease; }
    .tap:active { transform: scale(0.96); }
    .row-tap { transition: background 160ms ease; }
    .row-tap:active { background: #F2F1EC; }
    .card { transition: box-shadow 200ms ease, border-color 200ms ease; }
    /* Scrolling: momentum on iOS, and let the browser skip offscreen work */
    .scroll { -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    .defer { content-visibility: auto; contain-intrinsic-size: auto 120px; }
    /* Mobile: app fills screen */
    @media (max-width: 600px) {
      .stage { padding: 0 !important; background: #FAFAF7 !important; }
      .device { width: 100% !important; height: 100vh !important; height: 100dvh !important; border-radius: 0 !important; box-shadow: none !important; }
      .island { display: none !important; }
      .home-indicator { display: none !important; }
    }
    /* Respect the system setting — no motion for people who ask for none */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" crossorigin></script>
  <style>
    #qr-reader { width: 100%; height: 100%; }
    #qr-reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useMemo, useRef, Fragment } = React;

    // ═══════════════════════════════════════════════════════════════
    // Design tokens
    // ═══════════════════════════════════════════════════════════════
    const T = {
      bg: '#FAFAF7',
      card: '#FFFFFF',
      ink: '#0E0E0C',
      ink2: '#3A3A36',
      mute: '#7A7A72',
      hair: '#EDECE6',
      hair2: '#E2E1DB',
      accent: '#C56B4A',
      cal: '#C56B4A',
      protein: '#3D6FB5',
      carbs: '#C99232',
      fat: '#3E9979',
      water: '#5BA3D0',
      good: '#3E9970',
      warn: '#C68A2C',
    };

    // ═══════════════════════════════════════════════════════════════
    // Icons (stroke-based, minimal)
    // ═══════════════════════════════════════════════════════════════
    const Ic = {
      home: (s = 22, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 11l9-7 9 7v9a2 2 0 01-2 2h-4v-7H9v7H5a2 2 0 01-2-2v-9z"/>

      ),
      book: (s = 22, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 4h11a3 3 0 013 3v13H7a3 3 0 01-3-3V4z"/>
          <path d="M4 17a3 3 0 013-3h11"/>
        </svg>
      ),
      chart: (s = 22, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
        </svg>
      ),
      user: (s = 22, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M3 21c1.5-4 5-6 9-6s7.5 2 9 6"/>
        </svg>
      ),
      plus: (s = 22, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      ),
      search: (s = 18, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/>
        </svg>
      ),
      scan: (s = 22, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/>
          <path d="M7 8v8M10 8v8M13 8v8M17 8v8"/>
        </svg>
      ),
      close: (s = 22, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      ),
      back: (s = 22, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      ),
      drop: (s = 18, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round">
          <path d="M12 3s-7 7.5-7 12a7 7 0 0014 0c0-4.5-7-12-7-12z"/>
        </svg>
      ),
      check: (s = 18, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 12l5 5L20 6"/>
        </svg>
      ),
      flash: (s = 18, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round">
          <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
        </svg>
      ),
      star: (s = 18, c = 'currentColor', fill = 'none') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill={fill} stroke={c} strokeWidth="1.6" strokeLinejoin="round">
          <path d="M12 3l2.7 6 6.3.9-4.5 4.4 1 6.2-5.5-3-5.5 3 1-6.2L3 9.9 9.3 9z"/>
        </svg>
      ),
      chevR: (s = 18, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M9 6l6 6-6 6"/>
        </svg>
      ),
      minus: (s = 22, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round">
          <path d="M5 12h14"/>
        </svg>
      ),
      trash: (s = 20, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 7h16"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M6 7l1 14h10l1-14"/>
          <path d="M9 7V4h6v3"/>
        </svg>
      ),
      bottle: (s = 18, c = 'currentColor', fill = 'none') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <path d="M10 2h4v3l1.5 2A3 3 0 0117 9v10a3 3 0 01-3 3h-4a3 3 0 01-3-3V9a3 3 0 011.5-2L10 5V2z" fill={fill} />
          <path d="M7 11h10" />
        </svg>
      ),
      dumbbell: (s = 18, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>
        </svg>
      ),
      scale: (s = 18, c = 'currentColor') => (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="3"/>
          <path d="M12 8v3"/>
          <path d="M8.5 11a3.5 3.5 0 017 0"/>
        </svg>
      ),
    };

    // ═══════════════════════════════════════════════════════════════
    // Food database
    // ═══════════════════════════════════════════════════════════════
    const FOOD_DB = [
      { id: 'f1', name: 'Greek Yogurt', brand: 'Fage 0%', serving: '170 g container', cal: 100, p: 18, c: 6, f: 0, barcode: '0731214001019' },
      { id: 'f2', name: 'Banana', brand: 'Fresh', serving: '1 medium (118 g)', cal: 105, p: 1, c: 27, f: 0 },
      { id: 'f3', name: 'Almond Butter', brand: "Justin's", serving: '2 tbsp (32 g)', cal: 190, p: 7, c: 6, f: 18, barcode: '8949900201' },
      { id: 'f4', name: 'Sourdough Bread', brand: 'Whole Foods', serving: '1 slice (50 g)', cal: 130, p: 5, c: 25, f: 1 },
      { id: 'f5', name: 'Grilled Chicken Breast', brand: 'Generic', serving: '4 oz (113 g)', cal: 187, p: 35, c: 0, f: 4 },
      { id: 'f6', name: 'Brown Rice', brand: 'Cooked', serving: '1 cup (195 g)', cal: 216, p: 5, c: 45, f: 2 },
      { id: 'f7', name: 'Olive Oil', brand: 'EVOO', serving: '1 tbsp (14 g)', cal: 119, p: 0, c: 0, f: 14 },
      { id: 'f8', name: 'Mixed Greens Salad', brand: 'Garden', serving: '2 cups (85 g)', cal: 18, p: 2, c: 3, f: 0 },
      { id: 'f9', name: 'Cold Brew Coffee', brand: 'Stumptown', serving: '12 oz (355 ml)', cal: 5, p: 0, c: 1, f: 0 },
      { id: 'f10', name: 'Avocado', brand: 'Hass', serving: '½ medium (68 g)', cal: 114, p: 1, c: 6, f: 10 },
      { id: 'f11', name: 'Egg', brand: 'Large', serving: '1 egg (50 g)', cal: 72, p: 6, c: 0, f: 5 },
      { id: 'f12', name: 'Salmon Fillet', brand: 'Wild', serving: '5 oz (142 g)', cal: 280, p: 39, c: 0, f: 12 },
      { id: 'f13', name: 'Sweet Potato', brand: 'Roasted', serving: '1 medium (151 g)', cal: 130, p: 2, c: 30, f: 0 },
      { id: 'f14', name: 'Protein Shake', brand: 'Orgain', serving: '1 bottle (414 ml)', cal: 250, p: 26, c: 24, f: 7, barcode: '0851770003317' },
      { id: 'f15', name: 'Dark Chocolate', brand: 'Lindt 85%', serving: '3 squares (30 g)', cal: 180, p: 3, c: 10, f: 14, barcode: '0037466031507' },
    ];
    const RECENT_IDS = ['f1', 'f2', 'f5', 'f6', 'f9'];
    const DEFAULT_FAVORITE_IDS = ['f1', 'f5', 'f9', 'f14'];

    // Daily targets. Editable from Settings — App reassigns GOAL on every
    // render so every screen reads the user's current numbers.
    // Water is counted in bottles, not cups — one standard bottle is 16.9 oz.
    const OZ_PER_BOTTLE = 16.9;
    const bottleOz = (n) => Math.round(n * OZ_PER_BOTTLE);
    const DEFAULT_GOALS = { cal: 2200, p: 165, c: 220, f: 73, water: 4 };
    let GOAL = { ...DEFAULT_GOALS };

    // Body profile. Weight is always stored in lb and height in inches;
    // the unit toggle only changes how they're displayed and entered.
    const DEFAULT_PROFILE = { name: 'Abel Madera', heightIn: 70, goalWeight: 165, startWeight: 172, units: 'imperial' };

    // Macro maths. Grams are the source of truth; the split is derived so the
    // two can never disagree. 4 kcal per gram of protein and carbs, 9 for fat.
    const KCAL_PER_G = { p: 4, c: 4, f: 9 };
    const macroKcal = (g) => g.p * KCAL_PER_G.p + g.c * KCAL_PER_G.c + g.f * KCAL_PER_G.f;
    const macroSplit = (g) => {
      const total = macroKcal(g);
      if (!total) return { p: 0, c: 0, f: 0 };
      const p = Math.round((g.p * KCAL_PER_G.p / total) * 100);
      const c = Math.round((g.c * KCAL_PER_G.c / total) * 100);
      return { p, c, f: 100 - p - c };
    };
    // Turn a percentage split into grams for a given calorie target.
    const splitToGrams = (split, cal) => ({
      p: Math.round((cal * (split.p / 100)) / KCAL_PER_G.p),
      c: Math.round((cal * (split.c / 100)) / KCAL_PER_G.c),
      f: Math.round((cal * (split.f / 100)) / KCAL_PER_G.f),
    });
    // Common starting points. Cutting leans on protein to hold muscle in a
    // deficit; bulking leans on carbs to fuel the extra training volume.
    const SPLIT_PRESETS = [
      { key: 'balanced', label: 'Balanced', split: { p: 30, c: 40, f: 30 }, note: 'An even spread — a reasonable default for maintenance.' },
      { key: 'cutting', label: 'Cutting', split: { p: 40, c: 30, f: 30 }, note: 'Protein-forward, the usual approach when calories are lower.' },
      { key: 'bulking', label: 'Bulking', split: { p: 25, c: 50, f: 25 }, note: 'Carb-forward, aimed at fuelling higher training volume.' },
      { key: 'lowcarb', label: 'Low carb', split: { p: 35, c: 20, f: 45 }, note: 'Fat replaces most carbohydrate calories.' },
    ];

    const num = (n) => n.toLocaleString('en-US');
    const pct = (a, b) => Math.min(1, a / b);
    // 0–1 fraction that never goes negative or divides by zero
    const frac = (a, b) => (b > 0 ? Math.max(0, Math.min(1, a / b)) : 0);

    const LB_PER_KG = 2.2046226218;
    // Weights are shown and entered as whole numbers — the stored lb value keeps
    // its precision so converting between units doesn't drift.
    const toDisplayWeight = (lb, units) => Math.round(units === 'metric' ? lb / LB_PER_KG : lb);
    const fromDisplayWeight = (v, units) => units === 'metric' ? v * LB_PER_KG : v;
    const weightUnit = (units) => units === 'metric' ? 'kg' : 'lb';
    const fmtHeight = (inches, units) => {
      if (units === 'metric') return Math.round(inches * 2.54) + ' cm';
      return `${Math.floor(inches / 12)}′${Math.round(inches % 12)}″`;
    };

    // ═══════════════════════════════════════════════════════════════
    // iOS frame
    // ═══════════════════════════════════════════════════════════════
    function IOSDevice({ children, width = 402, height = 874 }) {
      return (
        <div className="device" style={{
          width, height, borderRadius: 48, overflow: 'hidden',
          position: 'relative', background: '#F2F2F7',
          boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
        }}>
          <div className="island" style={{
            position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
            width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
          }} />
          {children}
          <div className="home-indicator" style={{
            position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
            height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
            paddingBottom: 8, pointerEvents: 'none',
          }}>
            <div style={{ width: 139, height: 5, borderRadius: 100, background: 'rgba(0,0,0,0.25)' }} />
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // Macro rings
    // ═══════════════════════════════════════════════════════════════
    // Rings start empty and fill as you log food. The numbers around the card
    // still read as "remaining" — the arc is progress, the text is what's left.
    function MacroRings({ vals, goals, size = 220, ringW = 11, gap = 5 }) {
      const cx = size / 2, cy = size / 2;
      const r1 = size / 2 - ringW / 2 - 2;
      const r2 = r1 - ringW - gap;
      const r3 = r2 - ringW - gap;
      const r4 = r3 - ringW - gap;

      const Ring = ({ r, val, goal, color }) => {
        const C = 2 * Math.PI * r;
        const dash = C * frac(val, goal);
        return (
          <Fragment>
            <circle cx={cx} cy={cy} r={r} fill="none" stroke={T.hair} strokeWidth={ringW} />
            {dash > 0 && (
              <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={ringW}
                strokeDasharray={`${dash} ${C - dash}`} strokeLinecap="round"
                transform={`rotate(-90 ${cx} ${cy})`}
                style={{ transition: 'stroke-dasharray 600ms cubic-bezier(.2,.8,.2,1)' }} />
            )}
          </Fragment>
        );
      };

      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <Ring r={r1} val={vals.cal} goal={goals.cal} color={T.cal} />
          <Ring r={r2} val={vals.p} goal={goals.p} color={T.protein} />
          <Ring r={r3} val={vals.c} goal={goals.c} color={T.carbs} />
          <Ring r={r4} val={vals.f} goal={goals.f} color={T.fat} />
        </svg>
      );
    }

    // Counts down: the number is grams remaining, the bar is the share of the
    // target still available. Going over flips the label to "over".
    function MacroBar({ label, val, goal, color }) {
      const left = goal - val;
      const over = left < 0;
      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span style={{ fontSize: 11, fontWeight: 600, color: T.mute, textTransform: 'uppercase', letterSpacing: 0.6 }}>{label}</span>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 3 }}>
            <span style={{ fontSize: 18, fontWeight: 600, color: over ? T.warn : T.ink, fontVariantNumeric: 'tabular-nums' }}>
              {Math.round(Math.abs(left))}
            </span>
            <span style={{ fontSize: 11, color: T.mute, fontVariantNumeric: 'tabular-nums' }}>g {over ? 'over' : 'left'}</span>
          </div>
          <div style={{ height: 4, background: T.hair, borderRadius: 2, overflow: 'hidden' }}>
            <div style={{
              width: `${frac(val, goal) * 100}%`, height: '100%',
              background: over ? T.warn : color, transition: 'width 500ms cubic-bezier(.2,.8,.2,1)',
            }} />
          </div>
        </div>
      );
    }

    function MiniStat({ label, value, dotColor }) {
      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
            <div style={{ width: 6, height: 6, borderRadius: 3, background: dotColor }} />
            <span style={{ fontSize: 10, color: T.mute, fontWeight: 600, letterSpacing: 0.5, textTransform: 'uppercase' }}>{label}</span>
          </div>
          <span style={{ fontSize: 17, fontWeight: 700, color: T.ink, fontVariantNumeric: 'tabular-nums', letterSpacing: -0.3 }}>{value}</span>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // Tab bar
    // ═══════════════════════════════════════════════════════════════
    function TabBar({ tab, setTab, onAdd }) {
      const item = (k, label, icon) => {
        const active = tab === k;
        return (
          <button className="tap" onClick={() => setTab(k)} style={{
            flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
            background: 'none', border: 'none', padding: '8px 0', cursor: 'pointer',
            color: active ? T.ink : T.mute,
            transition: 'color 200ms ease',
          }}>
            {icon(24, active ? T.ink : T.mute)}
            <span style={{ fontSize: 10, fontWeight: active ? 600 : 500, letterSpacing: 0.2 }}>{label}</span>
          </button>
        );
      };
      return (
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 40,
          background: 'rgba(255,255,255,0.92)',
          backdropFilter: 'blur(20px) saturate(180%)',
          WebkitBackdropFilter: 'blur(20px) saturate(180%)',
          borderTop: `1px solid ${T.hair}`,
          paddingBottom: 'max(28px, env(safe-area-inset-bottom))', paddingTop: 4,
          display: 'flex', alignItems: 'center',
        }}>
          {item('home', 'Today', Ic.home)}
          {item('diary', 'Diary', Ic.book)}
          <button className="tap" onClick={onAdd} style={{
            width: 56, height: 56, borderRadius: 28, background: T.ink,
            border: 'none', cursor: 'pointer', margin: '-20px 4px 0',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: '0 8px 20px rgba(0,0,0,0.18), 0 2px 4px rgba(0,0,0,0.08)',
          }}>
            {Ic.plus(26, '#fff')}
          </button>
          {item('stats', 'Stats', Ic.chart)}
          {item('profile', 'You', Ic.user)}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // Dashboard
    // ═══════════════════════════════════════════════════════════════
    function Dashboard({ entries, workouts = [], water, setWater, onOpenFood, onAdd, profile }) {
      const totals = entries.reduce((a, e) => ({
        cal: a.cal + e.cal * e.qty, p: a.p + e.p * e.qty, c: a.c + e.c * e.qty, f: a.f + e.f * e.qty,
      }), { cal: 0, p: 0, c: 0, f: 0 });

      // Exercise adds calories back to the day's budget.
      const burned = workouts.reduce((s, w) => s + (w.cal || 0), 0);
      const calGoal = GOAL.cal + burned;
      const left = {
        cal: calGoal - totals.cal,
        p: GOAL.p - totals.p,
        c: GOAL.c - totals.c,
        f: GOAL.f - totals.f,
      };
      const overCal = left.cal < 0;
      const meals = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
      const mealData = meals.map(m => {
        const items = entries.filter(e => e.meal === m);
        const cal = items.reduce((s, e) => s + e.cal * e.qty, 0);
        return { meal: m, items, cal };
      });

      const today = new Date();
      const dayName = today.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
      const monthDay = today.toLocaleDateString('en-US', { month: 'long', day: 'numeric' }).toUpperCase();
      const hr = today.getHours();
      const greeting = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
      const firstName = (profile?.name || '').trim().split(' ')[0] || 'there';
      const initial = (firstName[0] || 'A').toUpperCase();

      return (
        <div className="screen" style={{ padding: '8px 20px 120px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 18 }}>
            <div>
              <div style={{ fontSize: 13, color: T.mute, fontWeight: 500, letterSpacing: 0.3 }}>{dayName} · {monthDay}</div>
              <div style={{ fontSize: 26, fontWeight: 700, color: T.ink, letterSpacing: -0.6, marginTop: 2 }}>{greeting}, {firstName}</div>
            </div>
            <div style={{
              width: 38, height: 38, borderRadius: 19, background: T.hair,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 14, fontWeight: 600, color: T.ink2,
            }}>{initial}</div>
          </div>

          <div style={{
            background: T.card, borderRadius: 24, padding: '22px 20px 20px',
            border: `1px solid ${T.hair}`, marginBottom: 14,
          }}>
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
              <div style={{ position: 'relative', width: 220, height: 220 }}>
                <MacroRings
                  vals={totals}
                  goals={{ cal: calGoal, p: GOAL.p, c: GOAL.c, f: GOAL.f }}
                  size={220} ringW={10} gap={3}
                />
                <div style={{
                  position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
                  alignItems: 'center', justifyContent: 'center', pointerEvents: 'none',
                }}>
                  <div style={{ fontSize: 10, color: T.mute, fontWeight: 600, letterSpacing: 0.7 }}>
                    {overCal ? 'OVER BUDGET' : 'REMAINING'}
                  </div>
                  <div style={{ fontSize: 35, fontWeight: 700, color: overCal ? T.warn : T.ink, letterSpacing: -0.8, fontVariantNumeric: 'tabular-nums', lineHeight: 1, marginTop: 2 }}>
                    {num(Math.round(Math.abs(left.cal)))}
                  </div>
                  <div style={{ fontSize: 11, color: T.mute, fontWeight: 500, marginTop: 2 }}>
                    kcal {overCal ? 'over' : 'left'}
                  </div>
                </div>
              </div>

              <div style={{ display: 'flex', width: '100%', marginTop: 16, gap: 8 }}>
                <MiniStat label="Eaten" value={num(Math.round(totals.cal))} dotColor={T.cal} />
                <div style={{ width: 1, background: T.hair }} />
                <MiniStat label="Burned" value={num(Math.round(burned))} dotColor={T.warn} />
                <div style={{ width: 1, background: T.hair }} />
                <MiniStat label="Budget" value={num(Math.round(calGoal))} dotColor={T.hair2} />
              </div>

              {burned > 0 && (
                <div style={{
                  marginTop: 12, width: '100%', display: 'flex', alignItems: 'center', gap: 8,
                  background: T.bg, border: `1px solid ${T.hair}`, borderRadius: 12, padding: '9px 12px',
                }}>
                  {Ic.dumbbell(16, T.warn)}
                  <span style={{ fontSize: 12, color: T.ink2, fontWeight: 500 }}>
                    {workouts.length} workout{workouts.length > 1 ? 's' : ''} added {num(Math.round(burned))} kcal to today's budget
                  </span>
                </div>
              )}
            </div>

            <div style={{
              display: 'flex', gap: 14, marginTop: 18, paddingTop: 16,
              borderTop: `1px solid ${T.hair}`,
            }}>
              <MacroBar label="Protein" val={totals.p} goal={GOAL.p} color={T.protein} />
              <MacroBar label="Carbs" val={totals.c} goal={GOAL.c} color={T.carbs} />
              <MacroBar label="Fat" val={totals.f} goal={GOAL.f} color={T.fat} />
            </div>
          </div>

          <WaterCard water={water} setWater={setWater} />

          <div style={{ marginTop: 22, marginBottom: 8, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ fontSize: 18, fontWeight: 700, color: T.ink, letterSpacing: -0.3 }}>Meals</div>
            <div style={{ fontSize: 12, color: T.mute, fontWeight: 500 }}>{entries.length} item{entries.length !== 1 ? 's' : ''} logged</div>
          </div>

          {mealData.map(({ meal, items, cal }) => (
            <MealCard key={meal} meal={meal} items={items} cal={cal} onOpenFood={onOpenFood} onAdd={() => onAdd(meal)} />
          ))}
        </div>
      );
    }

    // Water is tracked in whole bottles. Individual bottles are only drawn while
    // they still fit on a phone screen — past that the row would shrink each
    // bottle to nothing, so it switches to a plain count with a progress bar.
    const MAX_BOTTLE_ICONS = 8;
    const MAX_BOTTLES = 60;

    function WaterControl({ water, setWater, goal, height = 44 }) {
      const slots = Math.max(goal, water);
      const compact = slots > MAX_BOTTLE_ICONS;
      const dec = () => setWater(Math.max(0, water - 1));
      const inc = () => setWater(Math.min(MAX_BOTTLES, water + 1));

      const stepBtn = (dir) => (
        <button
          className="tap"
          onClick={dir === 1 ? inc : dec}
          disabled={dir === 1 ? water >= MAX_BOTTLES : water <= 0}
          aria-label={dir === 1 ? 'Add a bottle' : 'Remove a bottle'}
          style={{
            width: 32, height, borderRadius: 9,
            background: dir === 1 ? T.ink : T.hair, border: 'none',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer', color: dir === 1 ? '#fff' : T.ink2, flexShrink: 0,
            opacity: (dir === 1 ? water >= MAX_BOTTLES : water <= 0) ? 0.4 : 1,
          }}>{dir === 1 ? Ic.plus(16) : Ic.minus(16)}</button>
      );

      return (
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {stepBtn(-1)}
          {compact ? (
            <div style={{
              flex: 1, minWidth: 0, height, borderRadius: 10, background: T.bg,
              border: `1px solid ${T.hair2}`, padding: '0 12px',
              display: 'flex', alignItems: 'center', gap: 10,
            }}>
              {Ic.bottle(18, water >= goal ? T.good : T.water, water > 0 ? 'currentColor' : 'none')}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                  <span style={{ fontSize: 15, fontWeight: 700, color: T.ink, fontVariantNumeric: 'tabular-nums' }}>{water}</span>
                  <span style={{ fontSize: 11, color: T.mute, fontVariantNumeric: 'tabular-nums' }}>
                    of {goal} · {bottleOz(water)} oz
                  </span>
                </div>
                <div style={{ height: 3, background: T.hair, borderRadius: 2, overflow: 'hidden', marginTop: 4 }}>
                  <div style={{
                    width: `${frac(water, goal) * 100}%`, height: '100%',
                    background: water >= goal ? T.good : T.water,
                    transition: 'width 300ms cubic-bezier(.2,.8,.2,1)',
                  }} />
                </div>
              </div>
            </div>
          ) : (
            <div style={{ flex: 1, display: 'flex', gap: 5, justifyContent: 'center', minWidth: 0 }}>
              {Array.from({ length: slots }).map((_, i) => {
                const filled = i < water;
                const extra = i >= goal;
                return (
                  <button
                    key={i}
                    className="tap"
                    onClick={() => setWater(i + 1 === water ? i : i + 1)}
                    aria-label={`Set water to ${i + 1} bottle${i ? 's' : ''}`}
                    style={{
                      flex: '1 1 0', minWidth: 0, maxWidth: 48, height, borderRadius: 10,
                      background: filled ? (extra ? T.good : T.water) : T.bg,
                      border: `1.5px solid ${filled ? (extra ? T.good : T.water) : T.hair2}`,
                      padding: 0, cursor: 'pointer',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}>
                    {Ic.bottle(Math.min(20, height - 22), filled ? '#fff' : T.hair2, filled ? 'rgba(255,255,255,0.25)' : 'none')}
                  </button>
                );
              })}
            </div>
          )}
          {stepBtn(1)}
        </div>
      );
    }

    function WaterCard({ water, setWater }) {
      const goal = GOAL.water;
      return (
        <div className="card" style={{
          background: T.card, borderRadius: 18, padding: '14px 16px',
          border: `1px solid ${T.hair}`,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12, gap: 10 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              {Ic.bottle(18, T.water)}
              <span style={{ fontSize: 14, fontWeight: 600, color: T.ink }}>Water</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 4, fontVariantNumeric: 'tabular-nums' }}>
              <span style={{ fontSize: 16, fontWeight: 600, color: T.ink }}>{water}</span>
              <span style={{ fontSize: 11, color: T.mute }}>
                / {goal} bottle{goal === 1 ? '' : 's'} · {bottleOz(water)} oz
              </span>
            </div>
          </div>
          <WaterControl water={water} setWater={setWater} goal={goal} height={44} />
        </div>
      );
    }

    function MealCard({ meal, items, cal, onOpenFood, onAdd }) {
      return (
        <div className="card defer" style={{
          background: T.card, borderRadius: 18, marginBottom: 10,
          border: `1px solid ${T.hair}`, overflow: 'hidden',
        }}>
          <div style={{
            padding: '14px 16px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 600, color: T.ink }}>{meal}</div>
              <div style={{ fontSize: 11, color: T.mute, marginTop: 1, fontVariantNumeric: 'tabular-nums' }}>
                {Math.round(cal)} kcal {items.length > 0 && `· ${items.length} item${items.length > 1 ? 's' : ''}`}
              </div>
            </div>
            <button onClick={onAdd} style={{
              width: 32, height: 32, borderRadius: 16, background: T.bg, border: `1px solid ${T.hair2}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
              color: T.ink2,
            }}>{Ic.plus(18)}</button>
          </div>
          {items.length > 0 && (
            <div style={{ borderTop: `1px solid ${T.hair}` }}>
              {items.map((it, i) => (
                <button key={it.uid} className="row-tap" onClick={() => onOpenFood(it)} style={{
                  width: '100%', padding: '10px 16px', background: 'none', border: 'none',
                  borderTop: i > 0 ? `1px solid ${T.hair}` : 'none',
                  display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer', textAlign: 'left',
                }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 500, color: T.ink }}>{it.name}</div>
                    <div style={{ fontSize: 11, color: T.mute, marginTop: 1 }}>
                      {it.qty}× {it.serving}
                    </div>
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: T.ink, fontVariantNumeric: 'tabular-nums' }}>
                    {Math.round(it.cal * it.qty)}
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // Add Food
    // ═══════════════════════════════════════════════════════════════
    function AddFood({ meal, foods, customFoods, favorites, onClose, onPickFood, onScan, onCreateFood }) {
      const [q, setQ] = useState('');
      const [tab, setTab] = useState('recents');
      const [creating, setCreating] = useState(false);

      const results = q.trim()
        ? foods.filter(f => (f.name + ' ' + (f.brand || '')).toLowerCase().includes(q.toLowerCase()))
        : tab === 'recents'
          ? RECENT_IDS.map(id => foods.find(f => f.id === id)).filter(Boolean)
          : tab === 'favorites'
            ? Array.from(favorites).map(id => foods.find(f => f.id === id)).filter(Boolean)
            : tab === 'my foods'
              ? customFoods
              : foods.slice(0, 8);

      if (creating) {
        return (
          <CustomFoodForm
            meal={meal}
            onBack={() => setCreating(false)}
            onCreate={onCreateFood}
          />
        );
      }

      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: T.bg }}>
          <div style={{ padding: '54px 20px 14px', background: T.bg }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
              <button onClick={onClose} style={{
                width: 36, height: 36, borderRadius: 18, background: T.card, border: `1px solid ${T.hair}`,
                display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: T.ink,
              }}>{Ic.close(20)}</button>
              <div style={{ textAlign: 'center' }}>
                <div style={{ fontSize: 10, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>ADD TO</div>
                <div style={{ fontSize: 16, fontWeight: 700, color: T.ink, letterSpacing: -0.2 }}>{meal}</div>
              </div>
              <div style={{ width: 36 }} />
            </div>

            <div style={{
              display: 'flex', alignItems: 'center', gap: 10,
              background: T.card, border: `1px solid ${T.hair}`, borderRadius: 14,
              padding: '11px 14px', marginBottom: 10,
            }}>
              {Ic.search(18, T.mute)}
              <input
                autoFocus
                value={q}
                onChange={e => setQ(e.target.value)}
                placeholder="Search foods, brands…"
                style={{
                  flex: 1, border: 'none', outline: 'none', background: 'none',
                  fontSize: 15, color: T.ink, fontFamily: 'inherit', minWidth: 0,
                }}
              />
              {q && (
                <button onClick={() => setQ('')} style={{
                  background: T.hair, border: 'none', width: 20, height: 20, borderRadius: 10,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
                }}>{Ic.close(12, T.mute)}</button>
              )}
            </div>

            <div style={{ display: 'flex', gap: 8 }}>
              <ActionChip icon={Ic.scan(18, '#fff')} label="Scan barcode" onClick={onScan} dark />
              <ActionChip icon={Ic.plus(18, T.ink)} label="Add item" onClick={() => setCreating(true)} />
            </div>
          </div>

          {!q && (
            <div style={{ display: 'flex', gap: 4, padding: '6px 20px 0' }}>
              {['recents', 'favorites', 'my foods'].map(t => (
                <button key={t} onClick={() => setTab(t)} style={{
                  padding: '8px 14px', background: tab === t ? T.ink : 'transparent',
                  color: tab === t ? '#fff' : T.ink2, fontWeight: 600, fontSize: 12,
                  border: 'none', borderRadius: 16, cursor: 'pointer', letterSpacing: 0.2,
                  textTransform: 'capitalize',
                }}>{t}</button>
              ))}
            </div>
          )}

          <div className="scroll" style={{ flex: 1, overflowY: 'auto', padding: '12px 20px 100px' }}>
            {q && (
              <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, padding: '4px 0 10px' }}>
                {results.length} RESULT{results.length !== 1 ? 'S' : ''}
              </div>
            )}
            <div style={{
              background: T.card, border: `1px solid ${T.hair}`, borderRadius: 16, overflow: 'hidden',
            }}>
              {results.length === 0 && (
                <div style={{ padding: 28, textAlign: 'center', color: T.mute, fontSize: 13 }}>
                  No matches. Add your own item or try the barcode scanner.
                </div>
              )}
              {results.map((f, i) => (
                <button key={f.id} className="row-tap" onClick={() => onPickFood(f)} style={{
                  width: '100%', padding: '12px 14px', background: 'none', border: 'none',
                  borderTop: i > 0 ? `1px solid ${T.hair}` : 'none',
                  display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer', textAlign: 'left',
                }}>
                  <div style={{
                    width: 40, height: 40, borderRadius: 10, background: T.bg,
                    display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
                    border: `1px solid ${T.hair}`,
                    fontSize: 14, fontWeight: 600, color: T.ink2,
                  }}>{f.name[0]}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 500, color: T.ink, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{f.name}</div>
                    <div style={{ fontSize: 11, color: T.mute, marginTop: 1 }}>
                      {f.brand} · {f.serving}
                    </div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ fontSize: 14, fontWeight: 600, color: T.ink, fontVariantNumeric: 'tabular-nums' }}>{f.cal}</div>
                    <div style={{ fontSize: 10, color: T.mute }}>kcal</div>
                  </div>
                </button>

            </div>
          </div>

    function ActionChip({ icon, label, onClick, dark }) {
      return (
        <button onClick={onClick} style={{
          flex: 1, padding: '10px 12px', borderRadius: 12,
          background: dark ? T.ink : T.card, border: `1px solid ${dark ? T.ink : T.hair}`,
          color: dark ? '#fff' : T.ink, fontSize: 12.5, fontWeight: 600,
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, cursor: 'pointer',
        }}>
          {icon}
          <span>{label}</span>
        </button>
      );
    }

    // Labeled text/number input with a visible border and background — used in CustomFoodForm.
    function Field({ label, value, onChange, placeholder, suffix, type = 'text', autoFocus = false, flex }) {
      return (
        <label style={{
          display: 'flex', flexDirection: 'column', gap: 6, flex: flex, minWidth: 0,
        }}>
          <span style={{
            fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, textTransform: 'uppercase',
          }}>{label}</span>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 6,
            background: T.bg, border: `1px solid ${T.hair2}`, borderRadius: 10,
            padding: '10px 12px',
          }}>
            <input
              value={value}
              onChange={onChange}
              placeholder={placeholder}
              type={type}
              inputMode={type === 'number' ? 'decimal' : undefined}
              min={type === 'number' ? '0' : undefined}
              step={type === 'number' ? 'any' : undefined}

              style={{
                flex: 1, minWidth: 0, width: '100%',

    function CustomFoodForm({ meal: initialMeal, onBack, onCreate, initial }) {
      const pre = (v) => (v === 0 || v) ? String(v) : '';
      const [name, setName] = useState(initial?.name || '');
      const [brand, setBrand] = useState(initial?.brand || '');
      const [serving, setServing] = useState(initial?.serving || '');
      const [cal, setCal] = useState(pre(initial?.cal));
      const [p, setP] = useState(pre(initial?.p));
      const [c, setC] = useState(pre(initial?.c));
      const [f, setF] = useState(pre(initial?.f));
      const [qty, setQty] = useState(1);
      const [meal, setMeal] = useState(initialMeal || 'Breakfast');
      const [fav, setFav] = useState(false);

      const toNum = (v) => v === '' ? 0 : Number(v) || 0;
      const totalCal = Math.round(toNum(cal) * qty);
      const totalP = +(toNum(p) * qty).toFixed(1);
      const totalC = +(toNum(c) * qty).toFixed(1);
      const totalF = +(toNum(f) * qty).toFixed(1);
      const canSave = name.trim() && [cal, p, c, f].every(v => v !== '' && Number(v) >= 0);

      const numberChange = (setter) => (e) => {
        const v = e.target.value;
        if (v === '') setter('');
        else setter(String(Math.max(0, Number(v))));
      };

      const save = () => {
        if (!canSave) return;
        onCreate({
          food: {
            name: name.trim(),
            brand: brand.trim() || 'Custom',
            serving: serving.trim() || '1 serving',
            cal: toNum(cal),
            p: toNum(p),
            c: toNum(c),
            f: toNum(f),
            barcode: initial?.barcode, // remembered — future scans match your corrected version
            custom: true,
          },
          qty,
          meal,
          favorite: fav,
        });
      };

      return (
        <div style={{ height: '100%', background: T.bg, display: 'flex', flexDirection: 'column' }}>
          <div style={{
            padding: '54px 16px 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          }}>
            <button onClick={onBack} style={{
              width: 36, height: 36, borderRadius: 18, background: T.card, border: `1px solid ${T.hair}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: T.ink,
            }}>{Ic.back(20)}</button>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 10, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>NEW FOOD</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: T.ink, letterSpacing: -0.2 }}>Create</div>
            </div>
            <button onClick={() => setFav(v => !v)} aria-label="Save as favorite" style={{
              width: 36, height: 36, borderRadius: 18, background: T.card, border: `1px solid ${T.hair}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
            }}>{Ic.star(18, fav ? T.warn : T.ink2, fav ? T.warn : 'none')}</button>
          </div>

            {/* Basics */}
            <div style={{

              marginBottom: 14, display: 'flex', flexDirection: 'column', gap: 14,

            <div style={{
              background: T.card, borderRadius: 20, padding: '18px', border: `1px solid ${T.hair}`,
              marginBottom: 14, display: 'flex', flexDirection: 'column', gap: 14,
            }}>
              <div>
                <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>NUTRITION</div>
                <div style={{ fontSize: 11, color: T.mute, marginTop: 2 }}>Per serving size</div>

                value={cal}

                <Field
                  label="Protein"
                  value={p}

                  label="Carbs"

                  label="Fat"
                  value={f}
                  onChange={numberChange(setF)}
                  placeholder="0"

                  type="number"
                  flex={1}
                />
              </div>
              {/* Live macro bars */}
              {(toNum(cal) > 0 || toNum(p) > 0 || toNum(c) > 0 || toNum(f) > 0) && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingTop: 4 }}>
                  {[
                    { l: 'Protein', value: p, g: GOAL.p, color: T.protein },
                    { l: 'Carbs', value: c, g: GOAL.c, color: T.carbs },
                    { l: 'Fat', value: f, g: GOAL.f, color: T.fat },
                  ].map(m => (
                    <div key={m.l} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <div style={{ width: 56, fontSize: 11, color: T.mute, fontWeight: 500 }}>{m.l}</div>
                      <div style={{ flex: 1, height: 5, background: T.hair, borderRadius: 3, overflow: 'hidden' }}>
                        <div style={{ width: `${Math.min(100, (toNum(m.value) / m.g) * 100)}%`, height: '100%', background: m.color, transition: 'width 300ms' }} />
                      </div>
                      <div style={{ width: 50, textAlign: 'right', fontSize: 11, color: T.mute, fontVariantNumeric: 'tabular-nums' }}>
                        {Math.round((toNum(m.value) / m.g) * 100)}%
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Servings */}
            <div style={{
              background: T.card, borderRadius: 20, padding: '16px 18px', border: `1px solid ${T.hair}`, marginBottom: 14,
            }}>
              <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, marginBottom: 10 }}>HOW MANY SERVINGS?</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <button onClick={() => setQty(Math.max(0.25, +(qty - 0.25).toFixed(2)))} style={{
                  width: 44, height: 44, borderRadius: 22, background: T.bg, border: `1px solid ${T.hair2}`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: T.ink,
                }}>{Ic.minus(20)}</button>
                <div style={{ flex: 1, textAlign: 'center' }}>
                  <div style={{ fontSize: 30, fontWeight: 700, color: T.ink, letterSpacing: -0.8, fontVariantNumeric: 'tabular-nums', lineHeight: 1 }}>
                    {qty}
                  </div>
                  <div style={{ fontSize: 11, color: T.mute, marginTop: 2 }}>{serving || 'serving'}</div>
                </div>
                <button onClick={() => setQty(+(qty + 0.25).toFixed(2))} style={{
                  width: 44, height: 44, borderRadius: 22, background: T.ink, border: 'none',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: '#fff',
                }}>{Ic.plus(20)}</button>
              </div>
              <div style={{ display: 'flex', gap: 6, marginTop: 12 }}>
                {[0.5, 1, 1.5, 2].map(q => (
                  <button key={q} onClick={() => setQty(q)} style={{
                    flex: 1, padding: '7px 0', borderRadius: 9,
                    background: qty === q ? T.ink : T.bg,
                    color: qty === q ? '#fff' : T.ink2,
                    border: `1px solid ${qty === q ? T.ink : T.hair2}`,
                    fontSize: 12, fontWeight: 600, cursor: 'pointer', fontVariantNumeric: 'tabular-nums',
                  }}>{q}×</button>
                ))}
              </div>
            </div>

            {/* Meal */}
            <div style={{
              background: T.card, borderRadius: 20, padding: '16px 18px', border: `1px solid ${T.hair}`, marginBottom: 14,
            }}>
              <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, marginBottom: 10 }}>MEAL</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
                {['Breakfast', 'Lunch', 'Dinner', 'Snacks'].map(m => (
                  <button key={m} onClick={() => setMeal(m)} style={{
                    padding: '10px', borderRadius: 10,
                    background: meal === m ? T.ink : T.bg,
                    color: meal === m ? '#fff' : T.ink2,
                    border: `1px solid ${meal === m ? T.ink : T.hair2}`,
                    fontSize: 13, fontWeight: 600, cursor: 'pointer',
                  }}>{m}</button>
                ))}
              </div>
            </div>

            {/* Total preview */}
            <div style={{
              background: T.card, borderRadius: 20, padding: '16px 18px', border: `1px solid ${T.hair}`,
            }}>
              <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, marginBottom: 10 }}>TOTAL ({qty}× SERVING)</div>
              {[
                ['Calories', totalCal, 'kcal'],
                ['Protein', totalP, 'g'],
                ['Carbs', totalC, 'g'],
                ['Fat', totalF, 'g'],
              ].map(([l, v, u], i) => (
                <div key={i} style={{
                  display: 'flex', justifyContent: 'space-between', padding: '8px 0',
                  borderTop: i > 0 ? `1px solid ${T.hair}` : 'none',

                  <span style={{ fontSize: 13, fontWeight: 600, color: T.ink, fontVariantNumeric: 'tabular-nums' }}>{v} {u}</span>
                </div>

            </div>
          </div>

          <div style={{
            padding: '12px 20px 32px', borderTop: `1px solid ${T.hair}`, background: T.card,
          }}>
            <button disabled={!canSave} onClick={save} style={{
              width: '100%', padding: '15px', borderRadius: 16,
              background: canSave ? T.ink : T.hair2, border: 'none',
              color: canSave ? '#fff' : T.mute, fontWeight: 600, fontSize: 15,
              cursor: canSave ? 'pointer' : 'default',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
            }}>
              {Ic.plus(18, canSave ? '#fff' : T.mute)}
              <span>{canSave ? `Add ${totalCal} kcal to ${meal}` : 'Fill in name and nutrition'}</span>
            </button>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // Scanner
    // ═══════════════════════════════════════════════════════════════
    function Scanner({ foods, onClose, onMatch, onEdit }) {
      // status: starting | scanning | looking | matched | error
      const [status, setStatus] = useState('starting');
      const [matched, setMatched] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');
      const [flash, setFlash] = useState(false);
      const [zoom, setZoom] = useState(1);
      const [zoomMax, setZoomMax] = useState(0); // 0 = zoom unsupported
      const scannerRef = useRef(null);
      const lockRef = useRef(false);
      const stopRef = useRef(false);
      const containerRef = useRef(null);
      const trackerRef = useRef(null);
      const missRef = useRef(0);
      const scanning = status === 'scanning';

      // EAN-8 / UPC-A / EAN-13 check-digit validation — rejects one-off
      // misreads so a bad frame never sends you to the wrong product.
      const validCheckDigit = (code) => {
        if (![8, 12, 13].includes(code.length)) return true;
        const digits = code.split('').map(Number);
        const check = digits.pop();
        let sum = 0;
        digits.reverse().forEach((d, i) => { sum += d * (i % 2 === 0 ? 3 : 1); });
        return (10 - (sum % 10)) % 10 === check;
      };

      // Look up a barcode: local food DB first, then Open Food Facts
      const lookupBarcode = async (code) => {
        const norm = (s) => String(s).replace(/^0+/, '');
        const local = foods.find(f => f.barcode && norm(f.barcode) === norm(code));
        if (local) return local;
        const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);
        if (!res.ok) throw new Error('network');
        const data = await res.json();
        if (data.status !== 1 || !data.product) return null;
        const p = data.product;
        const n = p.nutriments || {};
        const num = (v) => {
          const x = typeof v === 'number' ? v : (v != null && v !== '' ? +v : NaN);
          return isFinite(x) ? x : null;
        };
        // Calories, with kJ→kcal fallback (some entries only list kilojoules)
        const kcal100 = num(n['energy-kcal_100g']) ?? (num(n['energy_100g']) != null ? num(n['energy_100g']) / 4.184 : null);
        const kcalServ = num(n['energy-kcal_serving']) ?? (num(n['energy_serving']) != null ? num(n['energy_serving']) / 4.184 : null);
        const servQty = num(p.serving_quantity); // serving size in g or ml
        // Use per-serving numbers when we can get them directly OR compute
        // them from per-100g + the serving weight. Decide per field, so one
        // missing value no longer zeroes out a macro.
        const useServing = kcalServ != null || (servQty != null && kcal100 != null);
        const pick = (key) => {
          const s = num(n[key + '_serving']);
          const h = num(n[key + '_100g']);
          let v = null;
          if (useServing) {
            if (s != null) v = s;
            else if (h != null && servQty != null) v = h * servQty / 100;
          } else {
            v = h;
          }
          return v == null ? 0 : Math.round(v * 10) / 10;
        };
        const calRaw = useServing
          ? (kcalServ != null ? kcalServ : (kcal100 || 0) * (servQty || 0) / 100)
          : (kcal100 || 0);
        return {
          id: 'scan-' + code,
          name: p.product_name || p.generic_name || 'Unknown product',
          brand: p.brands ? p.brands.split(',')[0].trim() : '',
          serving: useServing ? (p.serving_size || (servQty ? servQty + ' g' : '1 serving')) : 'per 100 g',
          cal: Math.round(calRaw),
          p: pick('proteins'),
          c: pick('carbohydrates'),
          f: pick('fat'),
          barcode: code,
          fromOFF: true, // community data — user should be able to correct it
        };
      };

      const handleDecode = async (text) => {
        if (lockRef.current) return;
        const code = (text || '').trim();
        if (!/^\d{6,14}$/.test(code)) return;        // not a product code — keep scanning
        if (!validCheckDigit(code)) return;          // likely misread frame — keep scanning
        lockRef.current = true;
        if (navigator.vibrate) navigator.vibrate(60); // haptic confirmation
        setStatus('looking');
        try {
          const food = await lookupBarcode(code);
          if (food) { setMatched(food); setStatus('matched'); }
          else { setErrorMsg('No product found for ' + code + '.'); setStatus('error'); }
        } catch (e) {
          setErrorMsg('Lookup failed. Check your connection.');
          setStatus('error');
        }
      };

      // Live tracker: draws a box that follows the barcode in the frame,
      // so you can see the moment the camera locks onto it.
      const positionTracker = (box, video) => {
        const el = trackerRef.current, wrap = containerRef.current;
        if (!el || !wrap || !video.videoWidth) return;
        const rect = wrap.getBoundingClientRect();
        // video uses object-fit: cover — map video coords to screen coords
        const scale = Math.max(rect.width / video.videoWidth, rect.height / video.videoHeight);
        const offX = (rect.width - video.videoWidth * scale) / 2;
        const offY = (rect.height - video.videoHeight * scale) / 2;
        const pad = 6;
        el.style.opacity = '1';
        el.style.transform = `translate(${box.x * scale + offX - pad}px, ${box.y * scale + offY - pad}px)`;
        el.style.width = (box.width * scale + pad * 2) + 'px';
        el.style.height = (box.height * scale + pad * 2) + 'px';
      };

      const startDetectorLoop = () => {
        if (!('BarcodeDetector' in window)) return;
        let detector;
        try {
          detector = new BarcodeDetector({
            formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'],
          });
        } catch (e) { return; }
        const tick = async () => {
          if (stopRef.current) return;
          const video = document.querySelector('#qr-reader video');
          if (video && video.readyState >= 2 && !lockRef.current) {
            try {
              const codes = await detector.detect(video);
              if (codes.length) {
                missRef.current = 0;
                positionTracker(codes[0].boundingBox, video);
                if (codes[0].rawValue) handleDecode(codes[0].rawValue);
              } else if (++missRef.current > 4 && trackerRef.current) {
                trackerRef.current.style.opacity = '0'; // fade only after a few empty frames
              }
            } catch (e) {}
          }
          setTimeout(tick, 70);
        };
        tick();
      };

      useEffect(() => {
        let cancelled = false;
        let scanner;
        try {
          scanner = new Html5Qrcode('qr-reader', {
            verbose: false,
            // Use the browser's native barcode engine when available — much
            // faster and more tolerant of angle/blur than the JS decoder.
            experimentalFeatures: { useBarCodeDetectorIfSupported: true },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.CODE_128,
              // QR intentionally excluded: food packages put marketing QR
              // codes right next to the UPC and they steal the detection.
            ],
          });
        } catch (e) {
          setErrorMsg('Scanner library failed to load.');
          setStatus('error');
          return;
        }
        scannerRef.current = scanner;
        scanner.start(
          { facingMode: 'environment' },
          {
            fps: 15, // scan more frames per second
            videoConstraints: {
              facingMode: 'environment',
              width: { ideal: 1920 },   // higher resolution = reads smaller
              height: { ideal: 1080 },  // and farther-away barcodes
              advanced: [{ focusMode: 'continuous' }], // keep autofocus hunting
            },
          },
          (text) => handleDecode(text),
          () => {} // per-frame "no code found" — ignore
        ).then(() => {
          if (cancelled) return;
          setStatus('scanning');
          startDetectorLoop();
          // Enable pinchless zoom buttons if the camera supports zoom
          try {
            const caps = scanner.getRunningTrackCapabilities();
            if (caps && caps.zoom && caps.zoom.max > 1) {
              setZoomMax(Math.min(caps.zoom.max, 5));
            }
          } catch (e) {}
        }).catch(() => {
          if (!cancelled) {
            setErrorMsg('Camera unavailable. Allow camera access (requires HTTPS or localhost).');
            setStatus('error');
          }
        });
        return () => {
          cancelled = true;
          stopRef.current = true;
          if (scanner && scanner.isScanning) {
            scanner.stop().then(() => scanner.clear()).catch(() => {});
          } else if (scanner) {
            try { scanner.clear(); } catch (e) {}
          }
        };
      }, []);

      const applyZoom = (z) => {
        const s = scannerRef.current;
        if (!s || !s.isScanning) return;
        s.applyVideoConstraints({ advanced: [{ zoom: z }] })
          .then(() => setZoom(z))
          .catch(() => {});
      };

      const toggleFlash = () => {
        const s = scannerRef.current;
        if (!s || !s.isScanning) return;
        const next = !flash;
        s.applyVideoConstraints({ advanced: [{ torch: next }] })
          .then(() => setFlash(next))
          .catch(() => {});
      };

      const scanAgain = () => {
        setMatched(null);
        setErrorMsg('');
        setStatus('scanning');
        lockRef.current = false;
        missRef.current = 0;
        if (trackerRef.current) trackerRef.current.style.opacity = '0';
      };

      const statusLabel = {
        starting: 'Starting camera…',
        scanning: 'Scanning…',
        looking: 'Looking up…',
        matched: 'Match found',
        error: 'Scan issue',
      }[status];

      return (
        <div ref={containerRef} style={{ height: '100%', position: 'relative', background: '#000', overflow: 'hidden' }}>
          <div id="qr-reader" style={{ position: 'absolute', inset: 0, background: '#0d0f12' }} />

          {/* Live tracker — follows the barcode once the camera sees it */}
          <div ref={trackerRef} style={{
            position: 'absolute', top: 0, left: 0, opacity: 0,
            border: `2.5px solid ${T.good}`, borderRadius: 10,
            boxShadow: `0 0 16px ${T.good}88, inset 0 0 16px ${T.good}44`,
            transition: 'transform 90ms linear, width 90ms linear, height 90ms linear, opacity 200ms ease',
            pointerEvents: 'none', zIndex: 4,
          }} />

          <div style={{
            position: 'absolute', inset: 0,
            background: 'radial-gradient(ellipse 240px 160px at 50% 42%, transparent 60%, rgba(0,0,0,0.55) 100%)',
            pointerEvents: 'none',
          }} />

          <div style={{
            position: 'absolute', top: 'calc(42% - 80px)', left: '50%', transform: 'translateX(-50%)',
            width: 240, height: 160, pointerEvents: 'none',
          }}>
            {[
              { top: -2, left: -2, p: 'lt' },
              { top: -2, right: -2, p: 'rt' },
              { bottom: -2, left: -2, p: 'lb' },
              { bottom: -2, right: -2, p: 'rb' },
            ].map((c, i) => {
              const s = { position: 'absolute', width: 28, height: 28, borderColor: matched ? T.good : '#fff', borderStyle: 'solid', borderWidth: 0 };
              if (c.p === 'lt') Object.assign(s, { top: c.top, left: c.left, borderTopWidth: 3, borderLeftWidth: 3, borderTopLeftRadius: 8 });
              if (c.p === 'rt') Object.assign(s, { top: c.top, right: c.right, borderTopWidth: 3, borderRightWidth: 3, borderTopRightRadius: 8 });
              if (c.p === 'lb') Object.assign(s, { bottom: c.bottom, left: c.left, borderBottomWidth: 3, borderLeftWidth: 3, borderBottomLeftRadius: 8 });
              if (c.p === 'rb') Object.assign(s, { bottom: c.bottom, right: c.right, borderBottomWidth: 3, borderRightWidth: 3, borderBottomRightRadius: 8 });
              return <div key={i} style={s} />;
            })}
            {scanning && (
              <div style={{
                position: 'absolute', left: 8, right: 8, height: 2,
                background: `linear-gradient(90deg, transparent, ${T.accent}, transparent)`,
                boxShadow: `0 0 12px ${T.accent}`,
                animation: 'scanLine 1.6s ease-in-out infinite',
              }} />
            )}
          </div>

          <div style={{
            position: 'absolute', top: 0, left: 0, right: 0, padding: '54px 16px 0',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center', zIndex: 5,
          }}>
            <button onClick={onClose} style={{
              width: 36, height: 36, borderRadius: 18, background: 'rgba(255,255,255,0.15)',
              backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
              border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
            }}>{Ic.close(20, '#fff')}</button>
            <div style={{
              padding: '6px 12px', borderRadius: 14, background: 'rgba(255,255,255,0.15)',
              backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
              fontSize: 12, fontWeight: 600, color: '#fff', letterSpacing: 0.3,
            }}>{statusLabel}</div>
            <button onClick={toggleFlash} style={{
              width: 36, height: 36, borderRadius: 18, background: flash ? '#fff' : 'rgba(255,255,255,0.15)',
              backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
              border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
            }}>{Ic.flash(18, flash ? T.ink : '#fff')}</button>
          </div>

          {(status === 'scanning' || status === 'starting') && (
            <div style={{
              position: 'absolute', top: 'calc(42% + 100px)', left: 0, right: 0, textAlign: 'center', zIndex: 5,
            }}>
              <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.85)', fontWeight: 500 }}>
                Center the barcode in the frame
              </div>
              {zoomMax > 1 && (
                <div style={{
                  display: 'inline-flex', gap: 4, marginTop: 14, padding: 4,
                  borderRadius: 20, background: 'rgba(255,255,255,0.15)',
                  backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
                }}>
                  {[1, 2, Math.min(3, zoomMax)].filter((z, i, a) => z <= zoomMax && a.indexOf(z) === i).map(z => (
                    <button key={z} onClick={() => applyZoom(z)} style={{
                      minWidth: 40, padding: '7px 10px', borderRadius: 16, border: 'none',
                      background: zoom === z ? '#fff' : 'transparent',
                      color: zoom === z ? T.ink : '#fff',
                      fontSize: 12, fontWeight: 700, cursor: 'pointer',
                    }}>{z}×</button>
                  ))}
                </div>
              )}
              <div>
                <button onClick={() => {
                  const v = prompt('Type the numbers printed under the barcode:');
                  if (v) handleDecode(v.replace(/\D/g, ''));
                }} style={{
                  marginTop: 12, padding: '9px 16px', borderRadius: 18, border: 'none',
                  background: 'rgba(255,255,255,0.15)',
                  backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
                  fontSize: 12, fontWeight: 600, color: '#fff', cursor: 'pointer',
                }}>Enter code manually</button>
              </div>
            </div>
          )}

          <div style={{
            position: 'absolute', bottom: 0, left: 0, right: 0,
            background: T.card, borderTopLeftRadius: 28, borderTopRightRadius: 28,
            padding: '14px 20px 28px',
            transform: (status === 'matched' || status === 'error') ? 'translateY(0)' : 'translateY(100%)',
            transition: 'transform 400ms cubic-bezier(.2,.8,.2,1)',
            boxShadow: '0 -20px 60px rgba(0,0,0,0.3)',
          }}>
            <div style={{
              width: 36, height: 4, borderRadius: 2, background: T.hair2,
              margin: '0 auto 16px',
            }} />
            {matched && (
              <Fragment>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
                  <div style={{
                    width: 22, height: 22, borderRadius: 11, background: T.good,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>{Ic.check(14, '#fff')}</div>
                  <div style={{ fontSize: 12, color: T.good, fontWeight: 600, letterSpacing: 0.3 }}>MATCHED · {matched.barcode}</div>
                </div>
                <div style={{ display: 'flex', alignItems: 'flex-start', gap: 14, marginBottom: 16 }}>
                  <div style={{
                    width: 56, height: 56, borderRadius: 14, background: T.bg, border: `1px solid ${T.hair}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: 22, fontWeight: 700, color: T.ink2, flexShrink: 0,
                  }}>{matched.name[0]}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 17, fontWeight: 700, color: T.ink, letterSpacing: -0.3 }}>{matched.name}</div>
                    <div style={{ fontSize: 12, color: T.mute, marginTop: 2 }}>{matched.brand} · {matched.serving}</div>
                    <div style={{ display: 'flex', gap: 14, marginTop: 10 }}>
                      <Macro mini label="kcal" val={matched.cal} color={T.cal} />
                      <Macro mini label="P" val={matched.p + 'g'} color={T.protein} />
                      <Macro mini label="C" val={matched.c + 'g'} color={T.carbs} />
                      <Macro mini label="F" val={matched.f + 'g'} color={T.fat} />
                    </div>
                  </div>
                </div>
                {matched.fromOFF && (
                  <div style={{
                    fontSize: 11, color: T.mute, marginBottom: 12, lineHeight: 1.45,
                    padding: '8px 10px', background: T.bg, borderRadius: 10, border: `1px solid ${T.hair}`,
                  }}>
                    From Open Food Facts (community data). If it doesn't match the label, tap Edit — your correction is saved for next time.
                  </div>
                )}
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={scanAgain} style={{
                    padding: '14px 16px', borderRadius: 14, background: T.bg, border: `1px solid ${T.hair2}`,
                    fontWeight: 600, fontSize: 14, color: T.ink, cursor: 'pointer',
                  }}>Rescan</button>
                  {matched.fromOFF && onEdit && (
                    <button onClick={() => onEdit(matched)} style={{
                      padding: '14px 16px', borderRadius: 14, background: T.bg, border: `1px solid ${T.hair2}`,
                      fontWeight: 600, fontSize: 14, color: T.ink, cursor: 'pointer',
                    }}>Edit</button>
                  )}
                  <button onClick={() => onMatch(matched)} style={{
                    flex: 1, padding: '14px', borderRadius: 14, background: T.ink, border: 'none',
                    fontWeight: 600, fontSize: 14, color: '#fff', cursor: 'pointer',
                  }}>Add to log</button>
                </div>
              </Fragment>
            )}
            {status === 'error' && (
              <Fragment>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
                  <div style={{
                    width: 22, height: 22, borderRadius: 11, background: T.warn,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    color: '#fff', fontSize: 14, fontWeight: 700,
                  }}>!</div>
                  <div style={{ fontSize: 12, color: T.warn, fontWeight: 600, letterSpacing: 0.3 }}>SCAN ISSUE</div>
                </div>
                <div style={{ fontSize: 14, color: T.ink2, marginBottom: 16, lineHeight: 1.4 }}>{errorMsg}</div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={onClose} style={{
                    padding: '14px 20px', borderRadius: 14, background: T.bg, border: `1px solid ${T.hair2}`,
                    fontWeight: 600, fontSize: 14, color: T.ink, cursor: 'pointer',
                  }}>Close</button>
                  <button onClick={scanAgain} style={{
                    flex: 1, padding: '14px', borderRadius: 14, background: T.ink, border: 'none',
                    fontWeight: 600, fontSize: 14, color: '#fff', cursor: 'pointer',
                  }}>Try again</button>
                </div>
              </Fragment>
            )}
          </div>
        </div>
      );
    }

    function Macro({ label, val, color, mini }) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <div style={{ width: 6, height: 6, borderRadius: 3, background: color }} />
            <span style={{ fontSize: 10, color: T.mute, fontWeight: 600, letterSpacing: 0.3 }}>{label.toUpperCase()}</span>
          </div>
          <span style={{ fontSize: mini ? 13 : 16, fontWeight: 600, color: T.ink, fontVariantNumeric: 'tabular-nums' }}>{val}</span>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // Food Detail
    // ═══════════════════════════════════════════════════════════════

      return (

                {food.brand?.toUpperCase()}
              </div>
              <div style={{ fontSize: 26, fontWeight: 700, color: T.ink, letterSpacing: -0.6, lineHeight: 1.15 }}>
                {food.name}
              </div>
              <div style={{ fontSize: 13, color: T.mute, marginTop: 6 }}>{food.serving}</div>

              background: T.card, borderRadius: 20, padding: '20px 18px', border: `1px solid ${T.hair}`,

                <div>
                  <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6 }}>CALORIES</div>

                    {cal}

                <div style={{ fontSize: 13, color: T.mute, marginBottom: 4 }}>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>

                ].map(m => (
                  <div key={m.l} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div style={{ width: 56, fontSize: 12, color: T.ink2, fontWeight: 500 }}>{m.l}</div>
                    <div style={{ flex: 1, height: 6, background: T.hair, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ width: `${Math.min(100, (m.v / m.g) * 100)}%`, height: '100%', background: m.color, transition: 'width 300ms' }} />

            <div style={{

            }}>
              <div style={{ fontSize: 11, color: T.mute, fontWeight: 600, letterSpacing: 0.6, marginBottom: 10 }}>SERVINGS</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <button onClick={() => setQty(Math.max(0.25, +(qty - 0.25).toFixed(2)))} style={{

                <div style={{ flex: 1, textAlign: 'center' }}>

                    {qty}

                  <button key={m} onClick={() => setMeal(m)} style={{
                    padding: '10px', borderRadius: 10,
                    background: meal === m ? T.ink : T.bg,
                    color: meal === m ? '#fff' : T.ink2,
                    border: `1px solid ${meal === m ? T.ink : T.hair2}`,

              {[
                ['Calories', cal, 'kcal'],
                ['Protein', p, 'g'],
                ['Carbohydrates', c, 'g'],

                  flex: '0 0 112px', padding: '15px 12px', borderRadius: 16,

                  <span>Remove</span>

              <button onClick={() => onLog({ ...food, qty, meal })} style={{
                flex: 1, padding: '15px', borderRadius: 16, background: T.ink, border: 'none',
                color: '#fff', fontWeight: 600, fontSize: 15, cursor: 'pointer',
                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,

    // ═══════════════════════════════════════════════════════════════
    // Diary
    // ═══════════════════════════════════════════════════════════════
    function Diary({
      entriesByDate, waterByDate, workoutsByDate, selectedDate, setSelectedDate,
      setWater, onOpenFood, onAddFood, onAddWorkout, onRemoveWorkout,
    }) {
      const [sub, setSub] = useState('food'); // which subsection of the diary is showing
      const [addingWorkout, setAddingWorkout] = useState(false);
      const todayKey = dateKey();
      const selected = parseDateKey(selectedDate);

      // Anchor the visible week to the *selected* date's Monday.
      const selectedDow = (selected.getDay() + 6) % 7;
      const weekStart = addDays(selected, -selectedDow);
      const week = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
      const weekKeys = week.map(dateKey);

      const dayLetters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

      const entriesFor = (key) => entriesByDate[key] || [];
      const totalsFor = (key) => entriesFor(key).reduce((a, e) => ({
